    openBookingModal(id = null) {
        const state = AppState.get();
        const booking = id ? state.bookings.find(b => b.id === id) : null;
        const availableRooms = state.rooms.filter(r => r.status === 'Available');
        const oldModal = document.getElementById('bookingModal');
        if (oldModal) oldModal.remove();

        const modalHtml = `
            <div class="modal fade" id="bookingModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content glass">
                        <div class="modal-header">
                            <h5 class="modal-title">${booking ? Lang.t('edit_booking') || 'Edit Booking' : Lang.t('create_booking')}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form id="bookingForm" novalidate>
                                <input type="hidden" id="bookId" value="${booking?.id || ''}">
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('customer')}</label>
                                    <select id="bookCustomer" class="form-select" required>
                                        <option value="">${Lang.t('select_customer') || 'Select customer...'}</option>
                                        ${state.customers.map(c => `<option value="${c.id}" ${booking?.customerId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('room')}</label>
                                    <select id="bookRoom" class="form-select" required>
                                        <option value="">${Lang.t('select_room') || 'Select room...'}</option>
                                        ${availableRooms.map(r => `<option value="${r.id}" ${booking?.roomId === r.id ? 'selected' : ''}>#${r.number} (${r.type}) - ${r.status}</option>`).join('')}
                                        ${availableRooms.length === 0 ? '<option value="" disabled>No available rooms</option>' : ''}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('checkin')}</label>
                                    <input id="bookCheckin" type="date" class="form-control" value="${booking?.checkin || ''}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('checkout')}</label>
                                    <input id="bookCheckout" type="date" class="form-control" value="${booking?.checkout || ''}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('status')}</label>
                                    <select id="bookStatus" class="form-select">
                                        <option value="Pending" ${booking?.status === 'Pending' ? 'selected' : ''}>${Lang.t('pending') || 'Pending'}</option>
                                        <option value="Checked-in" ${booking?.status === 'Checked-in' ? 'selected' : ''}>${Lang.t('checked_in')}</option>
                                        <option value="Checked-out" ${booking?.status === 'Checked-out' ? 'selected' : ''}>${Lang.t('checked_out')}</option>
                                        <option value="Cancelled" ${booking?.status === 'Cancelled' ? 'selected' : ''}>${Lang.t('cancel')}</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-glass" data-bs-dismiss="modal">${Lang.t('cancel')}</button>
                            <button class="btn-glass btn-glass-primary" id="saveBookingBtn">${Lang.t('save')}</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('modal-container').insertAdjacentHTML('beforeend', modalHtml);
        const modal = new bootstrap.Modal(document.getElementById('bookingModal'), { backdrop: 'static', keyboard: true });
        modal.show();

        document.getElementById('saveBookingBtn').addEventListener('click', () => {
            const id = document.getElementById('bookId').value;
            const customerId = document.getElementById('bookCustomer').value;
            const roomId = document.getElementById('bookRoom').value;
            const checkin = document.getElementById('bookCheckin').value;
            const checkout = document.getElementById('bookCheckout').value;
            const status = document.getElementById('bookStatus').value;

            if (!customerId || !roomId || !checkin || !checkout) { Toast.warning(Lang.t('required_field')); return; }
            if (checkout <= checkin) { Toast.warning('Check-out must be after check-in'); return; }

            const state = AppState.get();
            const existingBooking = state.bookings.find(b => b.roomId === roomId && (b.status === 'Checked-in' || b.status === 'Pending') && b.id !== id);
            if (existingBooking) { Toast.warning('This room is already booked'); return; }

            const bookingData = { customerId, roomId, checkin, checkout, status };
            if (id) {
                const idx = state.bookings.findIndex(b => b.id === id);
                if (idx > -1) {
                    const old = state.bookings[idx];
                    if (old.status === 'Checked-in' && status !== 'Checked-in') {
                        const room = state.rooms.find(r => r.id === old.roomId);
                        if (room) room.status = 'Available';
                    }
                    state.bookings[idx] = { ...state.bookings[idx], ...bookingData };
                    if (status === 'Checked-in') {
                        const room = state.rooms.find(r => r.id === roomId);
                        if (room) room.status = 'Booked';
                    }
                    Toast.success(Lang.t('booking_updated'));
                    this.addNotification('Booking updated', 'success', 'booking');
                }
            } else {
                bookingData.id = AppState.genId();
                bookingData.date = new Date().toISOString().split('T')[0];
                state.bookings.push(bookingData);
                if (status === 'Checked-in') {
                    const room = state.rooms.find(r => r.id === roomId);
                    if (room) room.status = 'Booked';
                }
                Toast.success(Lang.t('booking_created'));
                this.addNotification('Booking created', 'success', 'booking');
            }
            AppState.set(state);
            modal.hide();
            this.renderBookings();
            this.renderDashboard();
        });

        document.getElementById('bookingModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('bookingModal').remove();
        });
    },

    deleteBooking(id) {
        if (!confirm('Delete this booking?')) return;
        const state = AppState.get();
        const booking = state.bookings.find(b => b.id === id);
        if (booking) {
            const room = state.rooms.find(r => r.id === booking.roomId);
            if (room && (booking.status === 'Checked-in' || booking.status === 'Pending')) room.status = 'Available';
        }
        state.bookings = state.bookings.filter(b => b.id !== id);
        AppState.set(state);
        Toast.success(Lang.t('booking_deleted'));
        this.addNotification('Booking deleted', 'info', 'booking');
        this.renderBookings();
        this.renderDashboard();
    },

        document.getElementById('payBooking').addEventListener('change', function() {
            const bookingId = this.value;
            if (bookingId) {
                const booking = state.bookings.find(b => b.id === bookingId);
                if (booking) {
                    const room = state.rooms.find(r => r.id === booking.roomId);
                    if (room) {
                        const nights = Math.ceil((new Date(booking.checkout) - new Date(booking.checkin)) / (1000 * 60 * 60 * 24));
                        const total = room.price * (nights || 1);
                        if (!document.getElementById('payId').value) {
                            document.getElementById('payAmount').value = total;
                        }
                    }
                }

        document.getElementById('savePaymentBtn').addEventListener('click', () => {

        state.payments = state.payments.filter(p => p.id !== id);
        AppState.set(state);
        Toast.success(Lang.t('payment_deleted'));
        this.addNotification('Payment deleted', 'info', 'payment');
        this.renderPayments();
        this.renderDashboard();

    renderReports() {
        const state = AppState.get();
        const reportFilter = document.querySelector('.report-filter-btn.active')?.dataset.filter || 'today';
        let filteredPayments = state.payments;
        if (reportFilter === 'today') filteredPayments = filteredPayments.filter(p => p.date === new Date().toISOString().split('T')[0]);
        else if (reportFilter === 'week') {
            const weekStart = new Date();
            weekStart.setDate(weekStart.getDate() - 7);
            filteredPayments = filteredPayments.filter(p => new Date(p.date) >= weekStart);
        } else if (reportFilter === 'month') {
            const monthStart = new Date();
            monthStart.setMonth(monthStart.getMonth() - 1);
            filteredPayments = filteredPayments.filter(p => new Date(p.date) >= monthStart);
        } else if (reportFilter === 'year') {
            const yearStart = new Date();
            yearStart.setFullYear(yearStart.getFullYear() - 1);
            filteredPayments = filteredPayments.filter(p => new Date(p.date) >= yearStart);
        }
        const totalRevenue = filteredPayments.reduce((s, p) => s + (p.status === 'Paid' ? p.amount : 0), 0);

        document.getElementById('page-reports').innerHTML = `
            <h2 class="fw-light"><i class="fas fa-file-alt me-2"></i>${Lang.t('nav_reports')}</h2>

                <button class="filter-btn report-filter-btn active" data-filter="today"><i class="fas fa-calendar-day"></i> ${Lang.t('today_filter')}</button>

                <button class="filter-btn report-filter-btn" data-filter="month"><i class="fas fa-calendar-alt"></i> ${Lang.t('this_month')}</button>
                <button class="filter-btn report-filter-btn" data-filter="year"><i class="fas fa-calendar"></i> ${Lang.t('year') || 'This Year'}</button>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-6 col-md-3"><div class="glass-card text-center"><h6 class="text-muted">${Lang.t('total_revenue')}</h6><h4 class="fw-bold">${formatCurrency(totalRevenue)}</h4></div></div>
                <div class="col-6 col-md-3"><div class="glass-card text-center"><h6 class="text-muted">${Lang.t('paid_payments')}</h6><h4 class="fw-bold">${filteredPayments.filter(p => p.status === 'Paid').length}</h4></div></div>
                <div class="col-6 col-md-3"><div class="glass-card text-center"><h6 class="text-muted">${Lang.t('occupancy_rate')}</h6><h4 class="fw-bold">${state.rooms.length > 0 ? Math.round((state.rooms.filter(r => r.status === 'Booked' || r.status === 'Occupied').length / state.rooms.length) * 100) : 0}%</h4></div></div>
                <div class="col-6 col-md-3"><div class="glass-card text-center"><h6 class="text-muted">${Lang.t('nav_bookings')}</h6><h4 class="fw-bold">${state.bookings.length}</h4></div></div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6"><div class="glass-card"><canvas id="reportChart1" height="150"></canvas></div></div>
                <div class="col-md-6"><div class="glass-card"><canvas id="reportChart2" height="150"></canvas></div></div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn-glass btn-glass-primary" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> ${Lang.t('pdf_export')}</button>
                <button class="btn-glass btn-glass-primary" id="exportExcelBtn"><i class="fas fa-file-excel"></i> ${Lang.t('excel_export')}</button>
                <button class="btn-glass btn-glass-primary" id="printReportBtn"><i class="fas fa-print"></i> ${Lang.t('print')}</button>
            </div>
        `;

        document.querySelectorAll('.report-filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.report-filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                App.renderReports();
            });
        });

        const ctx1 = document.getElementById('reportChart1')?.getContext('2d');
        if (ctx1) {
            if (this.charts.report1) this.charts.report1.destroy();
            this.charts.report1 = new Chart(ctx1, {
                type: 'bar',
                data: { labels: ['Rooms','Customers','Bookings','Payments'], datasets: [{ label: 'Counts', data: [state.rooms.length, state.customers.length, state.bookings.length, state.payments.length], backgroundColor: 'rgba(129,140,248,0.4)' }] }
            });
        }
        const ctx2 = document.getElementById('reportChart2')?.getContext('2d');
        if (ctx2) {
            if (this.charts.report2) this.charts.report2.destroy();
            this.charts.report2 = new Chart(ctx2, {
                type: 'pie',
                data: { labels: ['Available','Booked','Maintenance'], datasets: [{ data: [
                    state.rooms.filter(r=>r.status==='Available').length,
                    state.rooms.filter(r=>r.status==='Booked' || r.status==='Occupied').length,
                    state.rooms.filter(r=>r.status==='Maintenance').length
                ], backgroundColor: ['#10B981','#F59E0B','#EF4444'] }] }
            });
        }

        document.getElementById('exportPdfBtn')?.addEventListener('click', () => this.exportPDF());
        document.getElementById('exportExcelBtn')?.addEventListener('click', () => this.exportExcel());
        document.getElementById('printReportBtn')?.addEventListener('click', () => window.print());
    },

    async exportPDF() {
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const settings = JSON.parse(localStorage.getItem('hms_settings')) || {};
            const hotelName = settings.hotelName || 'Grand Hotel';
            
            doc.setFontSize(24);
            doc.text(hotelName, 20, 25);
            doc.setFontSize(18);
            doc.text('Executive Summary', 20, 40);
            doc.setFontSize(10);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 50);
            
            const state = AppState.get();
            doc.setFontSize(12);
            let y = 75;
            const data = [
                ['Total Rooms', state.rooms.length],
                ['Customers', state.customers.length],
                ['Bookings', state.bookings.length],
                ['Total Revenue', formatCurrency(state.payments.reduce((s, p) => s + (p.status === 'Paid' ? p.amount : 0), 0))],
                ['Occupancy Rate', `${state.rooms.length > 0 ? Math.round((state.rooms.filter(r => r.status === 'Booked' || r.status === 'Occupied').length / state.rooms.length) * 100) : 0}%`]
            ];
            data.forEach(([label, value]) => { doc.text(`${label}: ${value}`, 25, y); y += 10; });
            doc.save('hotel_report.pdf');
            Toast.success(Lang.t('pdf_export') + ' ' + Lang.t('success'));
        } catch (e) { Toast.error('PDF export failed'); }
    },

    async exportExcel() {
        try {
            const state = AppState.get();
            const rows = [
                ['Hotel Management Report'],
                [`Generated: ${new Date().toLocaleString()}`],
                [],
                ['Metric', 'Value'],
                ['Total Rooms', state.rooms.length],
                ['Customers', state.customers.length],
                ['Bookings', state.bookings.length],
                ['Total Revenue', formatCurrency(state.payments.reduce((s, p) => s + (p.status === 'Paid' ? p.amount : 0), 0))],
                ['Paid Payments', state.payments.filter(p => p.status === 'Paid').length]
            ];
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, 'Report');
            XLSX.writeFile(wb, 'hotel_report.xlsx');
            Toast.success(Lang.t('excel_export') + ' ' + Lang.t('success'));
        } catch (e) { Toast.error('Excel export failed'); }
    },

    renderProfile() {
        const profile = JSON.parse(localStorage.getItem('hms_profile')) || { name: 'Admin User', email: 'admin@hotel.com', avatar: '' };
        document.getElementById('page-profile').innerHTML = `
            <h2 class="fw-light"><i class="fas fa-user-cog me-2"></i>${Lang.t('nav_profile')}</h2>
            <div class="glass-card">
                <form id="profileForm">
                    <div class="text-center mb-4">
                        <div class="avatar-upload" id="avatarContainer">
                            ${profile.avatar ? `<img src="${profile.avatar}" alt="Avatar">` : '<i class="fas fa-user"></i>'}
                            <input type="file" id="avatarInput" accept="image/*">
                        </div>
                        <button type="button" class="btn-glass btn-glass-sm mt-2" id="removeAvatarBtn" style="${profile.avatar ? '' : 'display:none;'}">${Lang.t('remove_avatar') || 'Remove Avatar'}</button>
                    </div>
                    <div class="mb-3"><label class="form-label">${Lang.t('name')}</label><input id="profileName" class="form-control" value="${profile.name || ''}" placeholder="${Lang.t('enter_name')}"></div>
                    <div class="mb-3"><label class="form-label">${Lang.t('email')}</label><input id="profileEmail" type="email" class="form-control" value="${profile.email || ''}" placeholder="${Lang.t('enter_email')}"></div>
                    <div class="mb-3"><label class="form-label">${Lang.t('new_password')}</label><input id="profilePassword" type="password" class="form-control" placeholder="${Lang.t('enter_password')}"></div>
                    <button class="btn-glass btn-glass-primary" type="submit">${Lang.t('update_profile')}</button>
                </form>
            </div>
        `;

        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const container = document.getElementById('avatarContainer');
                    container.innerHTML = `<img src="${ev.target.result}" alt="Avatar"><input type="file" id="avatarInput" accept="image/*">`;
                    document.getElementById('avatarInput').addEventListener('change', arguments.callee);
                    const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
                    profile.avatar = ev.target.result;
                    localStorage.setItem('hms_profile', JSON.stringify(profile));
                    document.getElementById('removeAvatarBtn').style.display = 'inline-block';
                    Toast.success('Avatar updated');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('removeAvatarBtn').addEventListener('click', function() {
            const container = document.getElementById('avatarContainer');
            container.innerHTML = `<i class="fas fa-user"></i><input type="file" id="avatarInput" accept="image/*">`;
            document.getElementById('avatarInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const container = document.getElementById('avatarContainer');
                        container.innerHTML = `<img src="${ev.target.result}" alt="Avatar"><input type="file" id="avatarInput" accept="image/*">`;
                        document.getElementById('avatarInput').addEventListener('change', arguments.callee);
                        const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
                        profile.avatar = ev.target.result;
                        localStorage.setItem('hms_profile', JSON.stringify(profile));
                        document.getElementById('removeAvatarBtn').style.display = 'inline-block';
                        Toast.success('Avatar updated');
                    };
                    reader.readAsDataURL(file);
                }
            });
            const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
            delete profile.avatar;
            localStorage.setItem('hms_profile', JSON.stringify(profile));
            this.style.display = 'none';
            Toast.success('Avatar removed');
        });

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('profileName').value.trim();
            const email = document.getElementById('profileEmail').value.trim();
            const password = document.getElementById('profilePassword').value;
            if (!name || !email) { Toast.warning(Lang.t('required_field')); return; }
            const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
            profile.name = name;
            profile.email = email;
            if (password) profile.password = password;
            localStorage.setItem('hms_profile', JSON.stringify(profile));
            Toast.success(Lang.t('profile_updated') || 'Profile updated');
            document.getElementById('profilePassword').value = '';
            App.addNotification('Profile updated successfully', 'success', 'system');
        });
    },

    renderSettings() {
        const settings = JSON.parse(localStorage.getItem('hms_settings')) || { 
            notifications: { bookings: true, payments: true, customers: true, browser: false },
            currency: 'USD',
            hotelName: 'Grand Hotel',
            hotelAddress: '123 Main Street',
            hotelPhone: '+998 90 123 45 67'
        };
        document.getElementById('page-settings').innerHTML = `
            <h2 class="fw-light"><i class="fas fa-sliders-h me-2"></i>${Lang.t('nav_settings')}</h2>
            <div class="glass-card">
                <h5>${Lang.t('appearance') || 'Appearance'}</h5>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="settingsDarkMode">
                    <label class="form-check-label">${Lang.t('dark_mode')}</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">${Lang.t('language')}</label>
                    <select id="settingsLanguage" class="form-select">
                        <option value="uz">🇺🇿 O'zbek</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="ru">🇷🇺 Русский</option>
                    </select>
                </div>
                <hr/>
                <h5>${Lang.t('hotel_info') || 'Hotel Information'}</h5>
                <div class="mb-3"><label class="form-label">${Lang.t('hotel_name')}</label><input id="hotelName" class="form-control" value="${settings.hotelName || 'Grand Hotel'}" placeholder="${Lang.t('enter_hotel_name') || 'Enter hotel name...'}"></div>
                <div class="mb-3"><label class="form-label">${Lang.t('hotel_address')}</label><input id="hotelAddress" class="form-control" value="${settings.hotelAddress || '123 Main Street'}"></div>
                <div class="mb-3"><label class="form-label">${Lang.t('hotel_phone')}</label><input id="hotelPhone" class="form-control" value="${settings.hotelPhone || '+998 90 123 45 67'}" maxlength="13"></div>
                <div class="mb-3"><label class="form-label">${Lang.t('currency') || 'Currency'}</label><select id="hotelCurrency" class="form-select">
                    <option value="USD" ${settings.currency === 'USD' ? 'selected' : ''}>USD ($)</option>
                    <option value="EUR" ${settings.currency === 'EUR' ? 'selected' : ''}>EUR (€)</option>
                    <option value="UZS" ${settings.currency === 'UZS' ? 'selected' : ''}>UZS (so'm)</option>
                </select></div>
                <hr/>
                <h5>${Lang.t('notifications')}</h5>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="notifBookings" ${settings.notifications?.bookings ? 'checked' : ''}><label>${Lang.t('booking_notifications') || 'Booking notifications'}</label></div>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="notifPayments" ${settings.notifications?.payments ? 'checked' : ''}><label>${Lang.t('payment_notifications') || 'Payment notifications'}</label></div>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="notifCustomers" ${settings.notifications?.customers ? 'checked' : ''}><label>${Lang.t('customer_notifications') || 'Customer notifications'}</label></div>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="notifBrowser" ${settings.notifications?.browser ? 'checked' : ''}><label>${Lang.t('browser_notifications') || 'Browser notifications'}</label></div>
                <hr/>
                <button class="btn-glass btn-glass-primary mt-3" id="saveSettingsBtn">${Lang.t('save_settings')}</button>
            </div>
        `;

        const phoneInput = document.getElementById('hotelPhone');
        phoneInput.addEventListener('input', function() {
            let val = this.value.replace(/[^0-9]/g, '');
            if (val.startsWith('998')) val = '+' + val;
            else if (val.length > 0 && !val.startsWith('+')) val = '+998' + val;
            if (val.length > 13) val = val.slice(0, 13);
            this.value = val;
        });

        document.getElementById('settingsDarkMode').checked = Theme.current === 'dark';
        document.getElementById('settingsDarkMode').addEventListener('change', function() { Theme.apply(this.checked ? 'dark' : 'light'); });
        document.getElementById('settingsLanguage').value = Lang.current;
        document.getElementById('settingsLanguage').addEventListener('change', function() { Lang.set(this.value); });

        document.getElementById('saveSettingsBtn').addEventListener('click', function() {
            const settings = {
                hotelName: document.getElementById('hotelName').value,
                hotelAddress: document.getElementById('hotelAddress').value,
                hotelPhone: document.getElementById('hotelPhone').value,
                currency: document.getElementById('hotelCurrency').value,
                notifications: {
                    bookings: document.getElementById('notifBookings').checked,
                    payments: document.getElementById('notifPayments').checked,
                    customers: document.getElementById('notifCustomers').checked,
                    browser: document.getElementById('notifBrowser').checked
                }
            };
            localStorage.setItem('hms_settings', JSON.stringify(settings));
            AppState.set({ currency: settings.currency });
            Toast.success(Lang.t('settings_saved') || 'Settings saved');
            App.addNotification('Settings updated successfully', 'success', 'system');
            App.renderPage(AppState.get().currentPage);
        });
    },

            AppState.addNotification('Welcome to HMS! Start managing your hotel.', 'info', 'system');
        }
    }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
