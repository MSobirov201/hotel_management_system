    <!-- ===== LOGIN ===== -->
    <div id="loginPage" class="login-page" role="main" aria-label="Kirish sahifasi">
        <div class="login-card" role="form" aria-label="Kirish formasi">
            <div class="logo text-center">
                <div style="font-size:3.5rem;margin-bottom:0.4rem;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
                    <i class="fas fa-hotel"></i>
                </div>
                <h2>HMS</h2>
                <p style="color:var(--text-muted);font-size:0.8rem;">Hotel Management System</p>
            </div>
            <form id="loginForm" novalidate autocomplete="off">
                <div class="mb-3">
                    <label class="form-label" data-i18n="username">Username</label>
                    <input type="text" id="loginUsername" class="form-control" value="admin" autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label" data-i18n="password">Password</label>
                    <input type="password" id="loginPassword" class="form-control" value="admin123" autocomplete="off">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="loginRemember">
                    <label class="form-check-label" data-i18n="remember_me">Remember me</label>
                </div>
                <button type="submit" class="btn-glass btn-glass-primary w-100" data-i18n="login">Login</button>
                <div class="text-center mt-2">
                    <button type="button" class="reset-password-btn" id="resetPasswordBtn">
                        <i class="fas fa-undo-alt me-1"></i> Parolni default holatga qaytarish (admin123)
                    </button>
                </div>
                <div class="text-center mt-1">
                    <button type="button" class="clear-storage-btn" id="clearStorageBtn">
                        <i class="fas fa-trash-alt me-1"></i> Ma'lumotlarni tozalash
                    </button>
                </div>
            </form>
            <div class="mt-3 text-center text-muted" style="font-size:0.7rem;opacity:0.6;">
                Default: admin / admin123
            </div>
        </div>
    </div>

        // ================================================================
        // XAVFSIZLIK: escapeHtml
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            var map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // ================================================================
        // VALYUTA KURSLARI
        // ================================================================
        function getCurrencyRates() {
            try {
                var saved = JSON.parse(localStorage.getItem('hms_currency_rates'));
                if (saved && typeof saved === 'object') {
                    return { USD: 1, EUR: 0.92, UZS: 12700, ...saved };
                }
            } catch (e) {}
            return { USD: 1, EUR: 0.92, UZS: 12700 };
        }

        function saveCurrencyRates(rates) {
            try {
                localStorage.setItem('hms_currency_rates', JSON.stringify(rates));
            } catch (e) {}
        }

        // ================================================================

        // ================================================================
        function formatCurrency(amountInUSD, forceCurrency) {
            var state = AppState ? AppState.get() : null;
            var curr = forceCurrency || state?.currency || 'USD';
            var amount = parseFloat(amountInUSD) || 0;
            var rates = getCurrencyRates();
            var rate = rates[curr] || 1;
            var converted = amount * rate;
            if (curr === 'UZS') {
                return new Intl.NumberFormat('uz-UZ').format(Math.round(converted)) + ' so\'m';
            }
            if (curr === 'EUR') {
                return '\u20AC' + converted.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            }
            return '$' + converted.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function getRelativeTime(timestamp) {
            var now = Date.now();
            var diff = now - timestamp;
            var s = Math.floor(diff / 1000);
            var m = Math.floor(s / 60);
            var h = Math.floor(m / 60);
            var d = Math.floor(h / 24);
            var lang = Lang?.current || 'uz';
            var tbl = {
                uz: { now: 'Hozirgina', m: function(n) { return n + ' daqiqa oldin'; }, h: function(n) { return n +
                            ' soat oldin'; }, d: function(n) { return n + ' kun oldin'; } },
                en: { now: 'Just now', m: function(n) { return n + 'm ago'; }, h: function(n) { return n + 'h ago'; },
                    d: function(n) { return n + 'd ago'; } },
                ru: { now: 'Только что', m: function(n) { return n + ' мин. назад'; }, h: function(n) { return n +
                            ' ч. назад'; }, d: function(n) { return n + ' дн. назад'; } }
            };
            var t = tbl[lang] || tbl.uz;
            if (s < 60) return t.now;
            if (m < 60) return t.m(m);
            if (h < 24) return t.h(h);
            if (d < 7) return t.d(d);
            return new Date(timestamp).toLocaleDateString(lang === 'ru' ? 'ru-RU' : lang === 'en' ? 'en-US' : 'uz-UZ');
        }

        function getStatusKey(status) {
            var map = {
                'Available': 'available',
                'Booked': 'booked',
                'Occupied': 'occupied',
                'Maintenance': 'cancelled',
                'Checked-in': 'active',
                'Checked-out': 'completed',
                'Pending': 'pending',
                'Cancelled': 'cancelled',
                'Paid': 'paid',
                'Unpaid': 'unpaid',
                'Refunded': 'cancelled',
                'Partially Paid': 'partial'
            };
            return map[status] || 'pending';
        }

        function calculateBookingTotal(booking, state) {
            var room = state.rooms.find(function(r) { return r.id === booking.roomId; });
            if (!room) return 0;
            var checkin = new Date(booking.checkin);
            var checkout = new Date(booking.checkout);
            var days = Math.max(1, Math.ceil((checkout - checkin) / (1000 * 60 * 60 * 24)));
            return room.price * days;
        }

        function getBookingPaymentStatus(booking, state) {
            var payments = state.payments.filter(function(p) { return p.bookingId === booking.id; });
            var totalPaid = payments.reduce(function(sum, p) { return sum + (p.status === 'Paid' ? p.amount : 0); }, 0);
            var totalPrice = calculateBookingTotal(booking, state);
            if (totalPaid === 0) return { status: 'Unpaid', paid: 0, remaining: totalPrice, total: totalPrice };
            if (totalPaid >= totalPrice) return { status: 'Paid', paid: totalPaid, remaining: 0, total: totalPrice };
            return { status: 'Partially Paid', paid: totalPaid, remaining: totalPrice - totalPaid, total: totalPrice };
        }

        function applyStagger(selector, delay) {
            if (delay === undefined) delay = 50;
            document.querySelectorAll(selector).forEach(function(el, i) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px) scale(0.97)';
                el.style.transition =
                    'opacity 0.35s ease ' + (i * delay) + 'ms, transform 0.35s cubic-bezier(0.34,1.56,0.64,1) ' + (i *
                        delay) + 'ms';
                requestAnimationFrame(function() {
                    setTimeout(function() {
                        el.style.opacity = '1';
                        el.style.transform = 'none';
                    }, 10);
                });
            });
        }

        // ===== DEBOUNCE =====
        function debounce(fn, delay) {
            if (delay === undefined) delay = 250;
            var timer = null;
            return function() {
                var args = arguments;
                var context = this;
                clearTimeout(timer);
                timer = setTimeout(function() { fn.apply(context, args); }, delay);
            };
        }

        // ================================================================
        // AUTH
        // ================================================================
        var Auth = {
            hashPassword: function(pwd) {
                var hash = 0;
                for (var i = 0; i < pwd.length; i++) {
                    var char = pwd.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return 'h_' + Math.abs(hash).toString(36);
            },
            isLoggedIn: function() { return localStorage.getItem('hms_logged_in') === 'true' || sessionStorage.getItem(
                    'hms_logged_in') === 'true'; },
            login: function(username, password, remember) {
                var storedHash = localStorage.getItem('hms_password_hash');
                if (!storedHash) {
                    storedHash = this.hashPassword('admin123');
                    localStorage.setItem('hms_password_hash', storedHash);
                }
                var inputHash = this.hashPassword(password);
                if (username === 'admin' && inputHash === storedHash) {
                    if (remember) {
                        localStorage.setItem('hms_logged_in', 'true');
                        localStorage.setItem('hms_remember', 'true');
                        localStorage.setItem('hms_user', username);
                    } else {
                        sessionStorage.setItem('hms_logged_in', 'true');
                        localStorage.removeItem('hms_remember');
                        localStorage.removeItem('hms_user');
                    }
                    return true;
                }
                return false;
            },
            resetPassword: function() {
                var defaultHash = this.hashPassword('admin123');
                localStorage.setItem('hms_password_hash', defaultHash);
                localStorage.removeItem('hms_logged_in');
                sessionStorage.removeItem('hms_logged_in');
                Toast.success('Parol default holatga qaytarildi: admin123');
                setTimeout(function() { window.location.reload(); }, 500);
            },
            clearStorage: function() {
                localStorage.clear();
                sessionStorage.clear();
                Toast.success('Barcha ma\'lumotlar tozalandi. Sahifa yangilanadi...');
                setTimeout(function() { window.location.reload(); }, 500);
            },
            logout: function() {
                localStorage.removeItem('hms_logged_in');
                localStorage.removeItem('hms_remember');
                localStorage.removeItem('hms_user');
                sessionStorage.removeItem('hms_logged_in');
                var app = document.getElementById('app');
                if (app) {
                    app.style.animation = 'loginFadeOut 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                    setTimeout(function() { window.location.reload(); }, 500);
                } else {
                    window.location.reload();
                }
            },
            check: function() { return this.isLoggedIn(); }
        };

        // ================================================================
        // APP STATE
        // ================================================================
        var AppState = {
            data: { rooms: [], customers: [], bookings: [], payments: [], notifications: [], theme: 'dark',
                language: 'uz', currentPage: 'dashboard', currency: 'USD' },
            load: function() {
                try {
                    var saved = localStorage.getItem('hms_state');
                    if (saved) this.data = { ...this.data, ...JSON.parse(saved) };
                    this.data.rooms = JSON.parse(localStorage.getItem('hms_rooms')) || [];
                    this.data.customers = JSON.parse(localStorage.getItem('hms_customers')) || [];
                    this.data.bookings = JSON.parse(localStorage.getItem('hms_bookings')) || [];
                    this.data.payments = JSON.parse(localStorage.getItem('hms_payments')) || [];
                    this.data.notifications = JSON.parse(localStorage.getItem('hms_notifications')) || [];
                    var settings = JSON.parse(localStorage.getItem('hms_settings')) || {};
                    this.data.currency = settings.currency || 'USD';
                    if (!localStorage.getItem('hms_password_hash')) {
                        localStorage.setItem('hms_password_hash', Auth.hashPassword('admin123'));
                    }

                    // Clean old bookings (older than 30 days) and move to history
                    var now = Date.now();
                    var thirtyDays = 30 * 24 * 60 * 60 * 1000;
                    var history = JSON.parse(localStorage.getItem('hms_history')) || [];
                    var newBookings = [];
                    this.data.bookings.forEach(function(b) {
                        var checkoutTime = new Date(b.checkout + 'T00:00:00').getTime();
                        if ((b.status === 'Checked-out' || b.status === 'Cancelled') && (now - checkoutTime > thirtyDays)) {
                            history.push({ booking: b, removedAt: new Date().toISOString() });
                        } else {
                            newBookings.push(b);
                        }
                    });
                    this.data.bookings = newBookings;
                    localStorage.setItem('hms_history', JSON.stringify(history));

                    // Clean old payments (older than 30 days) - only if booking is already removed
                    var paymentIds = this.data.bookings.map(function(b) { return b.id; });
                    this.data.payments = this.data.payments.filter(function(p) {
                        return paymentIds.includes(p.bookingId);
                    });

                    // Clean old notifications (older than 90 days)
                    var ninetyDays = 90 * 24 * 60 * 60 * 1000;
                    this.data.notifications = this.data.notifications.filter(function(n) {
                        return (now - n.time) < ninetyDays;
                    });

                    this.save();
                } catch (e) { console.warn(e); }
            },
            save: function() {
                try {
                    localStorage.setItem('hms_state', JSON.stringify({ theme: this.data.theme, language: this.data
                            .language, currentPage: this.data.currentPage }));
                    localStorage.setItem('hms_rooms', JSON.stringify(this.data.rooms));
                    localStorage.setItem('hms_customers', JSON.stringify(this.data.customers));
                    localStorage.setItem('hms_bookings', JSON.stringify(this.data.bookings));
                    localStorage.setItem('hms_payments', JSON.stringify(this.data.payments));
                    localStorage.setItem('hms_notifications', JSON.stringify(this.data.notifications));
                } catch (e) { console.warn(e); }
            },
            get: function() { return this.data; },
            set: function(newData) { this.data = { ...this.data, ...newData };
                this.save(); },
            genId: function() { return Date.now() + Math.random().toString(36).substr(2, 6); },
            addNotification: function(message, type, category) {
                if (type === undefined) type = 'info';
                if (category === undefined) category = 'system';
                var notif = { id: this.genId(), message: escapeHtml(message), type: type, category: category,
                    time: Date.now(), read: false };
                this.data.notifications.unshift(notif);
                if (this.data.notifications.length > 200) this.data.notifications = this.data.notifications.slice(0,
                200);
                this.save();
                return notif;
            }
        };

                    info: 'fa-info-circle' };
                div.className = 'toast-msg ' + type;
                div.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + escapeHtml(msg);
                this.container.appendChild(div);
                setTimeout(function() {
                    div.classList.add('fade-out');
                    setTimeout(function() { div.remove(); }, 300);
                }, 4000);
            },
            success: function(m) { this.show(m, 'success'); },

            init: function() {
                document.getElementById('resetPasswordBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Parolni default holatga (admin123) qaytarishni tasdiqlaysizmi?')) {
                        Auth.resetPassword();
                    }
                });
                document.getElementById('clearStorageBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Barcha lokal ma\'lumotlar tozalanadi. Davom etasizmi?')) {
                        Auth.clearStorage();
                    }
                });

                if (!Auth.check()) {
                    document.getElementById('loginPage').style.display = 'flex';
                    document.getElementById('app').style.display = 'none';
                    this.bindLoginEvents();
                    return;
                }
                var loginPage = document.getElementById('loginPage');
                if (loginPage) {
                    loginPage.classList.add('fade-out');
                    setTimeout(function() {
                        loginPage.style.display = 'none';
                        document.getElementById('app').style.display = 'flex';
                        App.initializeApp();
                    }, 500);
                } else {
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    this.initializeApp();
                }
            },

            initializeApp: function() {
                AppState.load();
                Theme.init();
                Lang.current = localStorage.getItem('hms_lang') || 'uz';
                Lang.apply();
                Toast.init();
                this.bindEvents();
                this.seedData();
                this.renderPage('dashboard');
                this.updateNotifications();
                setTimeout(function() { Toast.info('HMS ga xush kelibsiz'); }, 500);
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
                this.resizeObserver = new ResizeObserver(debounce(function() {
                    App.resizeCharts();
                }, 200));
                var mainContent = document.getElementById('mainContent');
                if (mainContent) {
                    this.resizeObserver.observe(mainContent);
                }
                window.addEventListener('orientationchange', function() {
                    setTimeout(function() { App.resizeCharts(); }, 400);
                });

                var toggleBtn = document.getElementById('sidebarToggle');
                if (toggleBtn) {
                    toggleBtn.classList.remove('open');
                    var icon = toggleBtn.querySelector('i');
                    if (icon) icon.className = 'fas fa-bars';
                }
            },

            resizeCharts: function() {
                Object.keys(this.charts).forEach(function(key) {
                    if (App.charts[key] && typeof App.charts[key].resize === 'function') {
                        App.charts[key].resize();
                    }
                });
            },

            bindLoginEvents: function() {
                document.getElementById('loginForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    var username = document.getElementById('loginUsername').value;
                    var password = document.getElementById('loginPassword').value;
                    var remember = document.getElementById('loginRemember').checked;
                    if (Auth.login(username, password, remember)) {
                        var loginPage = document.getElementById('loginPage');
                        if (loginPage) {
                            loginPage.classList.add('fade-out');
                            setTimeout(function() { window.location.reload(); }, 500);
                        } else {
                            window.location.reload();
                        }
                    } else {
                        Toast.error('Noto\'g\'ri foydalanuvchi nomi yoki parol');
                    }
                });

            bindEvents: function() {
                document.getElementById('themeToggle').addEventListener('click', function() { Theme.toggle(); });

                document.getElementById('langSelect').addEventListener('change', function() { Lang.set(this.value); });

                document.querySelectorAll('.sidebar .nav-link[data-page]').forEach(function(link) {
                    link.addEventListener('click', function() {
                        var page = this.dataset.page;
                        App.renderPage(page);
                        if (window.innerWidth <= 992) {
                            App.closeSidebar();
                        }
                    });
                });

                document.querySelectorAll('.mob-nav-item').forEach(function(item) {
                    item.addEventListener('click', function() {
                        var page = this.dataset.page;
                        if (page) {
                            App.renderPage(page);
                        }
                    });
                    item.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            App.renderPage(this.dataset.page);
                        }
                    });
                });

                document.getElementById('sidebarCloseBtn').addEventListener('click', function() {
                    App.closeSidebar();
                });

                document.getElementById('sidebarToggle').addEventListener('click', function() {
                    App.toggleSidebar();
                });

                document.getElementById('sidebarOverlay').addEventListener('click', function() {
                    App.closeSidebar();
                });

                document.getElementById('notifBell').addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dropdown = document.getElementById('notifDropdown');
                    if (dropdown.classList.contains('open')) {
                        App.closeNotifDropdown();
                    } else {
                        dropdown.classList.add('open');
                        dropdown.classList.remove('closing');
                        App.notifPage = 0;
                        App.updateNotifications();
                    }
                });

                document.addEventListener('click', function(e) {
                    var dropdown = document.getElementById('notifDropdown');
                    var bell = document.getElementById('notifBell');
                    var isInside = dropdown && dropdown.contains(e.target);
                    var isBell = bell && bell.contains(e.target);
                    if (dropdown && dropdown.classList.contains('open') && !isInside && !isBell) {
                        App.closeNotifDropdown();
                    }
                });

                document.addEventListener('touchstart', function(e) {
                    var dropdown = document.getElementById('notifDropdown');
                    var bell = document.getElementById('notifBell');
                    var isInside = dropdown && dropdown.contains(e.target);
                    var isBell = bell && bell.contains(e.target);
                    if (dropdown && dropdown.classList.contains('open') && !isInside && !isBell) {
                        App.closeNotifDropdown();
                    }
                }, { passive: true });

                document.getElementById('notifMarkAllRead').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.markAllNotificationsRead();
                });
                document.getElementById('notifClearAll').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.clearAllNotifications();
                });

                document.querySelectorAll('#notifFilters .filter-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        document.querySelectorAll('#notifFilters .filter-btn').forEach(function(b) {
                            b.classList.remove('active');
                        });
                        this.classList.add('active');
                        App.notifFilter = this.dataset.filter;
                        App.notifPage = 0;
                        App.updateNotifications();
                    });
                });

                var searchInput = document.getElementById('notifSearch');
                if (searchInput) {
                    searchInput.addEventListener('input', debounce(function(e) {
                        e.stopPropagation();
                        App.notifSearch = this.value.toLowerCase();
                        App.notifPage = 0;
                        App.updateNotifications();
                    }, 250));
                }

                document.getElementById('loadMoreBtn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.notifPage++;
                    App.updateNotifications(true);
                });
            },

            toggleSidebar: function() {
                var sidebar = document.getElementById('sidebar');
                var overlay = document.getElementById('sidebarOverlay');
                var toggleBtn = document.getElementById('sidebarToggle');
                var isOpen = sidebar.classList.contains('open');

                if (isOpen) {
                    this.closeSidebar();
                } else {
                    sidebar.classList.add('open');
                    overlay.classList.add('active');
                    toggleBtn.classList.add('open');
                    var icon = toggleBtn.querySelector('i');
                    if (icon) {
                        icon.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        icon.style.transform = 'scale(0) rotate(90deg)';
                        icon.style.opacity = '0';
                        setTimeout(function() {
                            icon.className = 'fas fa-times';
                            icon.style.transform = 'scale(1) rotate(0)';
                            icon.style.opacity = '1';
                        }, 300);
                    }
                }
            },

            closeSidebar: function() {
                var sidebar = document.getElementById('sidebar');
                var overlay = document.getElementById('sidebarOverlay');
                var toggleBtn = document.getElementById('sidebarToggle');
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                toggleBtn.classList.remove('open');
                var icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    icon.style.transform = 'scale(0) rotate(-90deg)';
                    icon.style.opacity = '0';
                    setTimeout(function() {
                        icon.className = 'fas fa-bars';
                        icon.style.transform = 'scale(1) rotate(0)';
                        icon.style.opacity = '1';
                    }, 300);
                }
            },

            closeNotifDropdown: function() {
                var dropdown = document.getElementById('notifDropdown');
                if (!dropdown.classList.contains('open')) return;
                dropdown.classList.add('closing');
                setTimeout(function() {
                    dropdown.classList.remove('open', 'closing');
                }, 300);
            },

            renderPage: function(page) {

                document.querySelectorAll('.sidebar .nav-link').forEach(function(l) { l.classList.remove('active'); });
                document.querySelector('.sidebar .nav-link[data-page="' + page + '"]')?.classList.add('active');

                document.getElementById('page-' + page)?.classList.add('active-page');

                document.querySelectorAll('.mob-nav-item').forEach(function(item) {
                    item.classList.toggle('active', item.dataset.page === page);

                    dashboard: 'fa-chart-pie',
                    rooms: 'fa-door-open',
                    customers: 'fa-users',
                    bookings: 'fa-calendar-check',
                    payments: 'fa-credit-card',
                    reports: 'fa-file-alt',
                    profile: 'fa-user-cog',
                    settings: 'fa-sliders-h'
                };
                var titleEl = document.getElementById('pageTitle');
                if (titleEl) {
                    titleEl.classList.add('changing');
                    setTimeout(function() {
                        titleEl.innerHTML = '<i class="fas ' + (iconMap[page] || 'fa-home') + '"></i>';
                        titleEl.classList.remove('changing');
                    }, 150);
                }

                var renderMap = {
                    dashboard: function() { App.renderDashboard(); },
                    rooms: function() { App.renderRooms(); },
                    customers: function() { App.renderCustomers(); },
                    bookings: function() { App.renderBookings(); },
                    payments: function() { App.renderPayments(); },
                    reports: function() { App.renderReports(); },
                    profile: function() { App.renderProfile(); },
                    settings: function() { App.renderSettings(); }
                };

            // ===== DATA MANAGEMENT =====
            exportData: function() {
                var state = AppState.get();
                var history = JSON.parse(localStorage.getItem('hms_history') || '[]');
                var data = {
                    rooms: state.rooms,
                    customers: state.customers,
                    bookings: state.bookings,
                    payments: state.payments,
                    history: history,
                    settings: JSON.parse(localStorage.getItem('hms_settings') || '{}'),
                    currencyRates: getCurrencyRates(),
                    exportedAt: new Date().toISOString()
                };
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'hms_backup_' + new Date().toISOString().split('T')[0] + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                Toast.success('Ma\'lumotlar eksport qilindi');
            },

            importData: function(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var data = JSON.parse(e.target.result);
                        if (!data.rooms || !data.customers || !data.bookings || !data.payments) {
                            Toast.error('Noto\'g\'ri fayl formati');
                            return;
                        }
                        showConfirm('Barcha mavjud ma\'lumotlar o\'chiriladi va yangilari yuklanadi. Davom etasizmi?',
                            function() {
                                AppState.set({
                                    rooms: data.rooms || [],
                                    customers: data.customers || [],
                                    bookings: data.bookings || [],
                                    payments: data.payments || []
                                });
                                if (data.history) {
                                    localStorage.setItem('hms_history', JSON.stringify(data.history));
                                }
                                if (data.settings) {
                                    localStorage.setItem('hms_settings', JSON.stringify(data.settings));
                                }
                                if (data.currencyRates) {
                                    saveCurrencyRates(data.currencyRates);
                                    CURRENCY_RATES = getCurrencyRates();
                                }
                                AppState.save();
                                Toast.success('Ma\'lumotlar import qilindi');
                                App.renderPage(AppState.get().currentPage);
                            }, false);
                    } catch (err) {
                        Toast.error('Faylni o\'qib bo\'lmadi: ' + err.message);
                    }
                };
                reader.readAsText(file);
            },

            // ===== NOTIFICATIONS =====
            updateNotifications: function(append) {
                if (append === undefined) append = false;
                var notifs = AppState.get().notifications;
                var settings = JSON.parse(localStorage.getItem('hms_settings') || '{}');
                var notifSettings = settings.notifications || {};
                var allowedCategories = [];
                if (notifSettings.bookings !== false) allowedCategories.push('booking');
                if (notifSettings.payments !== false) allowedCategories.push('payment');
                if (notifSettings.customers !== false) allowedCategories.push('customer');
                allowedCategories.push('system');

                var unread = notifs.filter(function(n) { return !n.read; });
                var badge = document.getElementById('notifBadge');
                var list = document.getElementById('notifList');
                var loadMore = document.getElementById('notifLoadMore');

                badge.style.display = unread.length > 0 ? 'flex' : 'none';
                if (unread.length > 0) badge.textContent = unread.length;

                var filtered = notifs.filter(function(n) { return allowedCategories.includes(n.category); });

                if (this.notifFilter === 'unread') filtered = filtered.filter(function(n) { return !n.read; });
                else if (this.notifFilter === 'booking') filtered = filtered.filter(function(n) { return n
                        .category === 'booking'; });
                else if (this.notifFilter === 'payment') filtered = filtered.filter(function(n) { return n
                        .category === 'payment'; });
                else if (this.notifFilter === 'customer') filtered = filtered.filter(function(n) { return n
                        .category === 'customer'; });
                else if (this.notifFilter === 'system') filtered = filtered.filter(function(n) { return n
                        .category === 'system'; });

                if (this.notifSearch) filtered = filtered.filter(function(n) { return n.message.toLowerCase().includes(
                        App.notifSearch); });

                var start = this.notifPage * this.notifLimit;
                var end = start + this.notifLimit;
                var pageItems = filtered.slice(start, end);

                document.querySelectorAll('#notifFilters .filter-btn').forEach(function(btn) {
                    var cat = btn.dataset.filter;
                    if (cat === 'all' || cat === 'unread' || allowedCategories.includes(cat)) {
                        btn.style.display = '';
                    } else {
                        btn.style.display = 'none';
                    }
                });

                if (append) {
                    pageItems.forEach(function(n) { list.appendChild(App.createNotifItem(n)); });
                } else {
                    list.innerHTML = '';
                    if (filtered.length === 0) {
                        list.innerHTML =
                            '<div class="notif-empty"><i class="fas fa-bell-slash"></i><div>' + Lang.t(
                                'no_notifications') + '</div></div>';
                    } else {
                        pageItems.forEach(function(n) { list.appendChild(App.createNotifItem(n)); });
                    }
                }
                loadMore.style.display = end < filtered.length ? 'block' : 'none';
                var loadMoreBtn = document.getElementById('loadMoreBtn');
                if (loadMoreBtn) loadMoreBtn.textContent = Lang.t('load_more');

                document.querySelectorAll('#notifFilters .filter-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.filter === App.notifFilter);
                });
            },

            createNotifItem: function(notif) {
                var div = document.createElement('div');
                div.className = 'notif-item' + (notif.read ? '' : ' unread');
                div.dataset.id = notif.id;

                var iconMap = {
                    booking: { icon: 'fa-calendar-check', cls: 'booking' },
                    payment: { icon: 'fa-credit-card', cls: 'payment' },
                    customer: { icon: 'fa-user', cls: 'customer' },
                    system: { icon: 'fa-cog', cls: 'system' },
                    error: { icon: 'fa-exclamation-circle', cls: 'error' }
                };
                var mapped = iconMap[notif.category] || { icon: 'fa-bell', cls: 'system' };

                div.innerHTML =
                    '<div class="notif-icon ' + mapped.cls + '">' +
                    '<i class="fas ' + mapped.icon + '"></i>' +
                    '</div>' +
                    '<div class="content">' +
                    '<div class="notif-message">' + escapeHtml(notif.message) + '</div>' +
                    '<div class="time"><i class="fas fa-clock"></i>' + getRelativeTime(notif.time) + '</div>' +
                    '</div>' +
                    '<div class="actions" style="display:flex;gap:4px;flex-shrink:0;">' +
                    (!notif.read ? '<button class="read-btn notif-action-btn" title="O\'qildi deb belgilash" data-id="' +
                        notif.id + '"><i class="fas fa-check"></i></button>' : '') +
                    '<button class="delete-btn notif-action-btn" title="O\'chirish" data-id="' + notif.id +
                    '" style="color:var(--color-danger);"><i class="fas fa-times"></i></button>' +
                    '</div>';

                div.querySelector('.read-btn')?.addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.markNotificationRead(this.dataset.id);
                });
                div.querySelector('.delete-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.deleteNotification(this.dataset.id);
                });

                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var id = this.dataset.id;
                    if (id) {
                        App.markNotificationRead(id);
                        App.closeNotifDropdown();
                    }
                });

                div.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                    var id = this.dataset.id;
                    if (id) {
                        App.markNotificationRead(id);
                        App.closeNotifDropdown();
                    }
                }, { passive: true });

                return div;
            },

            markNotificationRead: function(id) {
                var state = AppState.get();
                var notif = state.notifications.find(function(n) { return n.id === id; });
                if (notif) { notif.read = true;
                    AppState.set({ notifications: state.notifications });
                    this.updateNotifications(); }
            },

            markAllNotificationsRead: function() {
                var state = AppState.get();
                state.notifications.forEach(function(n) { n.read = true; });
                AppState.set({ notifications: state.notifications });
                this.updateNotifications();
                Toast.success('Barcha xabarlar o\'qildi');
            },

            deleteNotification: function(id) {
                var state = AppState.get();
                state.notifications = state.notifications.filter(function(n) { return n.id !== id; });
                AppState.set({ notifications: state.notifications });
                this.updateNotifications();
            },

            clearAllNotifications: function() {
                AppState.set({ notifications: [] });
                this.updateNotifications();
                Toast.success('Barcha xabarlar tozalandi');
            },

            addNotification: function(message, type, category) {
                if (type === undefined) type = 'info';
                if (category === undefined) category = 'system';
                try {
                    var settings = JSON.parse(localStorage.getItem('hms_settings') || '{}');
                    var notifSettings = settings.notifications || {};
                    if (category === 'booking' && notifSettings.bookings === false) return null;
                    if (category === 'payment' && notifSettings.payments === false) return null;
                    if (category === 'customer' && notifSettings.customers === false) return null;
                } catch (e) {}

                var notif = AppState.addNotification(message, type, category);
                this.updateNotifications();

                try {
                    var settings = JSON.parse(localStorage.getItem('hms_settings') || '{}');
                    if (settings.notifications?.browser &&
                        'Notification' in window &&
                        Notification.permission === 'granted') {
                        new Notification('HMS Xabari', { body: message });

            openRoomModal: function(id) {
    if (id === undefined) id = null;
    var state = AppState.get();
    var room = id ? state.rooms.find(function(r) { return r.id === id; }) : null;
    // ... (existing modal HTML generation) ...

    // Save button handler
    document.getElementById('saveRoomBtn').addEventListener('click', async function() {
        var id = document.getElementById('roomId').value;
        var number = document.getElementById('roomNumber').value.trim();
        var type = document.getElementById('roomType').value;
        var price = parseFloat(document.getElementById('roomPrice').value);
        var status = document.getElementById('roomStatus').value;

        if (!number || !price) { Toast.warning(Lang.t('required_field')); return; }

        var roomData = { number: number, floor: 1, room_type: type, capacity: 2, price_per_night: price, status: status, description: '' };

        if (ROOMS_USE_API) {
            try {
                var submitBtn = document.getElementById('saveRoomBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saqlanmoqda...';

                if (id) {
                    // Update
                    var updatedRoom = await roomService.updateRoom(id, roomData);
                    var idx = state.rooms.findIndex(function(r) { return r.id === id; });
                    if (idx > -1) { state.rooms[idx] = updatedRoom; }
                    Toast.success(Lang.t('room_updated'));
                    App.addNotification('Xona #' + number + ' yangilandi', 'success', 'system');
                } else {
                    // Create
                    var newRoom = await roomService.createRoom(roomData);
                    state.rooms.push(newRoom);
                    Toast.success(Lang.t('room_added'));
                    App.addNotification('Xona #' + number + ' qo\'shildi', 'success', 'system');
                }
                AppState.set(state);
                modal.hide();
                App.renderRooms();
                App.renderDashboard();
            } catch (error) {
                if (error.data && error.data.errors) {
                    var errMsg = Object.values(error.data.errors).flat().join(' ');
                    Toast.error(errMsg);
                } else {
                    Toast.error(error.message || 'Xatolik yuz berdi');
                }
            } finally {
                var submitBtn = document.getElementById('saveRoomBtn');
                submitBtn.disabled = false;
                submitBtn.innerHTML = Lang.t('save');
            }
        } else {
            // Original localStorage logic
            // ... (keep existing localStorage logic) ...
        }
    });
},

            deleteRoom: function(id) {
    showConfirm('Bu xonani o\'chirmoqchimisiz?', async function() {
        var state = AppState.get();
        var room = state.rooms.find(function(r) { return r.id === id; });

        if (ROOMS_USE_API) {
            try {
                await roomService.deleteRoom(id);
                state.rooms = state.rooms.filter(function(r) { return r.id !== id; });
                AppState.set(state);
                Toast.success(Lang.t('room_deleted'));
                App.addNotification('Xona #' + (room?.number || '') + ' o\'chirildi', 'info', 'system');
                App.renderRooms();
                App.renderDashboard();
            } catch (error) {
                Toast.error(error.message || 'Xatolik yuz berdi');
            }
        } else {
            // Original localStorage logic
            state.rooms = state.rooms.filter(function(r) { return r.id !== id; });
            AppState.set(state);
            Toast.success(Lang.t('room_deleted'));
            App.addNotification('Xona #' + (room?.number || '') + ' o\'chirildi', 'info', 'system');
            App.renderRooms();
            App.renderDashboard();
        }
    });
},

            openBookingModal: function(id) {
                if (id === undefined) id = null;
                var state = AppState.get();

                var availableRooms = state.rooms.filter(function(r) { return r.status === 'Available'; });

                            '>' + escapeHtml(c.name) + '</option>'; }).join('') +
                    '</select>' +
                    '</div>' +
                    '<div class="mb-3">' +
                    '<label class="form-label">' + Lang.t('room') + '</label>' +
                    '<select id="bookRoom" class="form-select" required>' +

                        'save') + '</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';

                document.getElementById('modal-container').insertAdjacentHTML('beforeend', modalHtml);
                var modal = new bootstrap.Modal(document.getElementById('bookingModal'), { backdrop: 'static',
                    keyboard: true });
                modal.show();

                document.getElementById('saveBookingBtn').addEventListener('click', function() {
                    var id = document.getElementById('bookId').value;
                    var customerId = document.getElementById('bookCustomer').value;
                    var roomId = document.getElementById('bookRoom').value;
                    var checkin = document.getElementById('bookCheckin').value;
                    var checkout = document.getElementById('bookCheckout').value;
                    var status = document.getElementById('bookStatus').value;

                    if (!customerId || !roomId || !checkin || !checkout) { Toast.warning(Lang.t(
                        'required_field')); return; }
                    if (checkout <= checkin) { Toast.warning(
                            'Chiqish sanasi kirish sanasidan keyin bo\'lishi kerak'); return; }

                    var state = AppState.get();
                    var conflict = state.bookings.find(function(b) {
                        if (b.id === id) return false;
                        if (b.status === 'Cancelled' || b.status === 'Checked-out') return false;
                        if (b.roomId !== roomId) return false;
                        var newStart = new Date(checkin);
                        var newEnd = new Date(checkout);
                        var oldStart = new Date(b.checkin);
                        var oldEnd = new Date(b.checkout);
                        return (newStart < oldEnd && newEnd > oldStart);
                    });
                    if (conflict) { Toast.warning('Bu xona uchun sanalar to\'qnashuvi mavjud!'); return; }

                    var bookingData = { customerId: customerId, roomId: roomId, checkin: checkin,
                        checkout: checkout, status: status };
                    if (id) {
                        var idx = state.bookings.findIndex(function(b) { return b.id === id; });
                        if (idx > -1) {
                            var old = state.bookings[idx];
                            if (old.status === 'Checked-in' && status !== 'Checked-in') {
                                var room = state.rooms.find(function(r) { return r.id === old
                                        .roomId; });
                                if (room) room.status = 'Available';
                            }
                            state.bookings[idx] = { ...state.bookings[idx], ...bookingData };
                            if (status === 'Checked-in') {
                                var room = state.rooms.find(function(r) { return r.id ===
                                        roomId; });
                                if (room) room.status = 'Booked';
                            }
                            Toast.success(Lang.t('booking_updated'));
                            App.addNotification('Bron yangilandi', 'success', 'booking');
                        }
                    } else {
                        bookingData.id = AppState.genId();
                        bookingData.date = new Date().toISOString().split('T')[0];
                        state.bookings.push(bookingData);
                        if (status === 'Checked-in') {
                            var room = state.rooms.find(function(r) { return r.id === roomId; });
                            if (room) room.status = 'Booked';
                        }
                        Toast.success(Lang.t('booking_created'));
                        App.addNotification('Bron yaratildi', 'success', 'booking');
                    }
                    AppState.set(state);
                    modal.hide();
                    App.renderBookings();
                    App.renderDashboard();
                });

                document.getElementById('bookingModal').addEventListener('hidden.bs.modal', function() {
                    document.getElementById('bookingModal').remove();
                });
            },

            deleteBooking: function(id) {
                showConfirm('Bu bronni o\'chirmoqchimisiz?', function() {
                    var state = AppState.get();
                    var booking = state.bookings.find(function(b) { return b.id === id; });
                    if (booking) {
                        var room = state.rooms.find(function(r) { return r.id === booking.roomId; });
                        if (room && (booking.status === 'Checked-in' || booking.status === 'Pending'))
                            room.status = 'Available';
                    }
                    state.bookings = state.bookings.filter(function(b) { return b.id !== id; });
                    AppState.set(state);
                    Toast.success(Lang.t('booking_deleted'));
                    App.addNotification('Bron o\'chirildi', 'info', 'booking');
                    App.renderBookings();
                    App.renderDashboard();
                });
            },

            openPaymentModal: function(id, bookingId, amount) {
                if (id === undefined) id = null;
                if (bookingId === undefined) bookingId = null;
                if (amount === undefined) amount = null;

                var state = AppState.get();
                var payment = id ? state.payments.find(function(p) { return p.id === id; }) : null;
                var booking = bookingId ? state.bookings.find(function(b) { return b.id === bookingId; }) : (payment ?
                    state.bookings.find(function(b) { return b.id === payment.bookingId; }) : null);

                var oldModal = document.getElementById('paymentModal');
                if (oldModal) oldModal.remove();

                var defaultAmount = amount || payment?.amount || '';
                var defaultMethod = payment?.method || 'Cash';
                var defaultStatus = payment?.status || 'Pending';

                var allBookings = state.bookings.map(function(b) {
                    var c = state.customers.find(function(c) { return c.id === b.customerId; });
                    var r = state.rooms.find(function(r) { return r.id === b.roomId; });
                    return { ...b, customerName: c ? c.name : 'N/A', roomNumber: r ? r.number : 'N/A' };
                });

                var modalHtml =
                    '<div class="modal fade" id="paymentModal" tabindex="-1" role="dialog" aria-modal="true" aria-label="' +
                    (payment ? 'To\'lovni tahrirlash' : 'To\'lov qo\'shish') + '">' +
                    '<div class="modal-dialog modal-dialog-centered">' +
                    '<div class="modal-content glass">' +
                    '<div class="modal-header">' +
                    '<h5 class="modal-title">' + (payment ? 'To\'lovni tahrirlash' : 'To\'lov qo\'shish') +
                    '</h5>' +
                    '<button type="button" class="btn-close" data-bs-dismiss="modal"></button>' +
                    '</div>' +
                    '<div class="modal-body">' +
                    '<form id="paymentForm" novalidate>' +
                    '<input type="hidden" id="payId" value="' + escapeHtml(payment?.id || '') +
                    '">' +
                    '<input type="hidden" id="payBookingHidden" value="' + escapeHtml(booking?.id || '') +
                    '">' +
                    '<div class="mb-3">' +
                    '<label class="form-label">' + Lang.t('booking') + '</label>';
                    if (bookingId) {
                        var b = state.bookings.find(function(b) { return b.id === bookingId; });
                        var c = b ? state.customers.find(function(c) { return c.id === b.customerId; }) : null;
                        var r = b ? state.rooms.find(function(r) { return r.id === b.roomId; }) : null;
                        modalHtml += '<div id="payBookingLabel" class="form-control" style="border-radius:var(--radius-full);background:var(--input-bg);padding:0.6rem 1.2rem;">' +
                            escapeHtml(c ? c.name : 'N/A') + ' - Xona ' + escapeHtml(r ? r.number : 'N/A') +
                            '</div>';
                        modalHtml += '<input type="hidden" id="payBooking" value="' + escapeHtml(bookingId) + '">';
                    } else {
                        modalHtml +=
                            '<select id="payBooking" class="form-select" required>' +
                            '<option value="">' + Lang.t('select_booking') + '</option>' +
                            allBookings.map(function(b) {
                                var isActive = b.status === 'Checked-in' || b.status === 'Pending';
                                var isCurrent = payment && b.id === payment.bookingId;
                                if (!isActive && !isCurrent) return '';
                                var label = b.customerName + ' - Xona ' + b.roomNumber + ' (' + b.status +
                                    ')';
                                return '<option value="' + escapeHtml(b.id) + '" ' + (booking?.id ===
                                    b.id || payment?.bookingId === b.id ? 'selected' : '') +
                                    '>' + escapeHtml(label) + '</option>';
                            }).join('') +
                            '</select>';
                    }
                    modalHtml +=
                    '</div>' +
                    '<div class="mb-3">' +
                    '<label class="form-label">' + Lang.t('amount') + ' (USD)</label>' +
                    '<input id="payAmount" type="number" step="0.01" class="form-control" value="' +
                    escapeHtml(defaultAmount) + '" placeholder="' + Lang.t('enter_amount') +
                    '" required>' +
                    '</div>' +
                    '<div class="mb-3">' +
                    '<label class="form-label">' + Lang.t('method') + '</label>' +
                    '<select id="payMethod" class="form-select">' +
                    '<option value="Cash" ' + (defaultMethod === 'Cash' ? 'selected' : '') +
                    '>Cash</option>' +
                    '<option value="Card" ' + (defaultMethod === 'Card' ? 'selected' : '') +
                    '>Card</option>' +
                    '<option value="Bank Transfer" ' + (defaultMethod === 'Bank Transfer' ?
                        'selected' : '') + '>Bank Transfer</option>' +
                    '<option value="Online" ' + (defaultMethod === 'Online' ? 'selected' :
                        '') + '>Online</option>' +
                    '</select>' +
                    '</div>' +
                    '<div class="mb-3">' +
                    '<label class="form-label">' + Lang.t('status') + '</label>' +
                    '<select id="payStatus" class="form-select">' +
                    '<option value="Pending" ' + (defaultStatus === 'Pending' ? 'selected' :
                        '') + '>Kutilmoqda</option>' +
                    '<option value="Paid" ' + (defaultStatus === 'Paid' ? 'selected' : '') +
                    '>' + Lang.t('paid_payments') + '</option>' +
                    '<option value="Refunded" ' + (defaultStatus === 'Refunded' ? 'selected' :
                        '') + '>Qaytarilgan</option>' +
                    '</select>' +
                    '</div>' +
                    '</form>' +
                    '</div>' +
                    '<div class="modal-footer">' +
                    '<button class="btn-glass" data-bs-dismiss="modal">' + Lang.t('cancel') +
                    '</button>' +
                    '<button class="btn-glass btn-glass-primary" id="savePaymentBtn">' + Lang.t(
                        'save') + '</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';

                document.getElementById('modal-container').insertAdjacentHTML('beforeend', modalHtml);
                var modal = new bootstrap.Modal(document.getElementById('paymentModal'), { backdrop: 'static',
                    keyboard: true });
                modal.show();

                document.getElementById('savePaymentBtn').addEventListener('click', function() {
                    var id = document.getElementById('payId').value;
                    var bookingId = document.getElementById('payBookingHidden').value ||
                        document.getElementById('payBooking').value;
                    var amount = parseFloat(document.getElementById('payAmount').value);
                    var method = document.getElementById('payMethod').value;
                    var status = document.getElementById('payStatus').value;

                    if (!bookingId || !amount || amount <= 0) { Toast.warning(Lang.t(
                        'required_field')); return; }

                    var state = AppState.get();
                    var booking = state.bookings.find(function(b) { return b.id === bookingId; });
                    if (!booking) { Toast.warning('Bron topilmadi'); return; }

                    var totalPrice = calculateBookingTotal(booking, state);
                    var paymentStatus = getBookingPaymentStatus(booking, state);

                    if (status === 'Paid' && paymentStatus.status === 'Paid') {
                        Toast.warning(Lang.t('booking_already_paid'));
                        return;
                    }
                    if (status === 'Paid' && amount > paymentStatus.remaining) {
                        Toast.warning(Lang.t('payment_exceeds_total'));
                        return;
                    }

                    var payData = { bookingId: bookingId, amount: amount, method: method, status: status,
                        date: new Date().toISOString().split('T')[0] };
                    if (id) {
                        var idx = state.payments.findIndex(function(p) { return p.id === id; });
                        if (idx > -1) { state.payments[idx] = { ...state.payments[idx], ...payData };
                            Toast.success(Lang.t('payment_updated'));
                            App.addNotification('To\'lov yangilandi', 'success', 'payment'); }
                    } else {
                        payData.id = AppState.genId();
                        state.payments.push(payData);
                        Toast.success(Lang.t('payment_added'));
                        App.addNotification('To\'lov qo\'shildi', 'success', 'payment');
                    }
                    AppState.set(state);
                    modal.hide();
                    App.renderPayments();
                    App.renderDashboard();
                });

                document.getElementById('paymentModal').addEventListener('hidden.bs.modal', function() {
                    document.getElementById('paymentModal').remove();
                });
            },

                    App.addNotification('To\'lov o\'chirildi', 'info', 'payment');
                    App.renderPayments();

            exportPDFReport: function() {
                var state = AppState.get();
                var totalRooms = state.rooms.length;
                var totalCustomers = state.customers.length;
                var totalBookings = state.bookings.length;
                var totalRevenue = state.payments.reduce(function(sum, p) { return sum + (p.status === 'Paid' ? p
                        .amount : 0); }, 0);
                var paidPayments = state.payments.filter(function(p) { return p.status === 'Paid'; }).length;
                var booked = state.rooms.filter(function(r) { return r.status === 'Booked' || r.status === 'Occupied'; })
                    .length;
                var occupancy = totalRooms > 0 ? Math.round((booked / totalRooms) * 100) : 0;

                var doc = new jspdf.jsPDF();
                doc.text('Mehmonxona Hisoboti', 20, 20);
                doc.text('Yaratilgan: ' + new Date().toLocaleString(), 20, 30);

                doc.autoTable({
                    startY: 40,
                    head: [['Ko\'rsatkich', 'Qiymat']],
                    body: [
                        ['Jami Xonalar', totalRooms],
                        ['Mijozlar', totalCustomers],
                        ['Bronlar', totalBookings],
                        ['Jami Daromad', formatCurrency(totalRevenue)],
                        ["To'langan To'lovlar", paidPayments],
                        ['Bandlik Darajasi', occupancy + '%']
                    ],
                    theme: 'grid',
                    styles: { fontSize: 10 }
                });

                var finalY = doc.lastAutoTable.finalY + 10;

                doc.text('Xonalar ro\'yxati', 20, finalY);
                doc.autoTable({
                    startY: finalY + 5,
                    head: [['Raqam', 'Tur', 'Narx', 'Holat']],
                    body: state.rooms.map(function(r) { return [r.number, r.type, '$' + r.price, r.status]; }),
                    theme: 'grid',
                    styles: { fontSize: 9 }
                });

                finalY = doc.lastAutoTable.finalY + 10;
                if (finalY > 270) { doc.addPage();
                    finalY = 20; }

                doc.text('Bronlar ro\'yxati', 20, finalY);
                doc.autoTable({
                    startY: finalY + 5,
                    head: [['Mijoz', 'Xona', 'Kirish', 'Chiqish', 'Holat']],
                    body: state.bookings.slice(0, 15).map(function(b) {
                        var c = state.customers.find(function(c) { return c.id === b.customerId; });
                        var r = state.rooms.find(function(r) { return r.id === b.roomId; });
                        return [c ? c.name : 'N/A', r ? r.number : 'N/A', b.checkin, b.checkout, b
                            .status];
                    }),
                    theme: 'grid',
                    styles: { fontSize: 9 }
                });

                finalY = doc.lastAutoTable.finalY + 10;
                if (finalY > 270) { doc.addPage();
                    finalY = 20; }

                doc.text('To\'lovlar ro\'yxati', 20, finalY);
                doc.autoTable({
                    startY: finalY + 5,
                    head: [['Bron', 'Miqdor', 'Usul', 'Holat', 'Sana']],
                    body: state.payments.slice(0, 15).map(function(p) {
                        var b = state.bookings.find(function(b) { return b.id === p.bookingId; });
                        return [b ? b.id : 'N/A', '$' + p.amount, p.method, p.status, p.date];
                    }),
                    theme: 'grid',
                    styles: { fontSize: 9 }
                });

                doc.save('hms_report.pdf');
                Toast.success('PDF eksport qilindi');
            },

            exportHistoryPDF: function() {
                var history = JSON.parse(localStorage.getItem('hms_history') || '[]');

                var state = AppState.get();

                for (var i = 1; i <= 15; i++) {
                    var types = ['Standard', 'Deluxe', 'Luxury', 'Suite', 'VIP'];
                    var type = types[Math.floor(Math.random() * types.length)];
                    var priceMap = { Standard: 80, Deluxe: 120, Luxury: 180, Suite: 250, VIP: 380 };
                    var status = 'Available';
                    if (i % 5 === 0) status = 'Maintenance';
                    rooms.push({
                        id: AppState.genId(),
                        number: String(100 + i),
                        type: type,
                        price: priceMap[type] || 80,
                        status: status
                    });
                }

                var customers = [];
                var names = ['Ali Valiyev', 'Gulnora Karimova', 'Shoxruh Saidov', 'Dilnoza Azimova', 'Jasur Qodirov',
                    'Madina Rustamova', 'Bobur Mirzayev', 'Sevara Abdullayeva', 'Otabek Alimov', 'Nigora Ismoilova'
                ];
                names.forEach(function(name, i) {
                    customers.push({
                        id: AppState.genId(),
                        name: name,
                        email: name.toLowerCase().replace(/\s/g, '') + '@mail.uz',
                        phone: '+99890' + String(1000000 + i * 111111).slice(0, 7)
                    });
                });

                var today = new Date().toISOString().split('T')[0];
                var bookings = [];
                var paymentMethods = ['Cash', 'Card', 'Bank Transfer', 'Online'];
                var payments = [];
                for (var i = 0; i < 15; i++) {
                    var customer = customers[i % customers.length];
                    var room = rooms[i % rooms.length];
                    var checkin = new Date();
                    checkin.setDate(checkin.getDate() + i * 2);
                    var checkout = new Date(checkin);
                    checkout.setDate(checkout.getDate() + 2 + Math.floor(Math.random() * 3));
                    var statuses = ['Checked-in', 'Checked-out', 'Pending', 'Cancelled'];
                    var status = statuses[Math.floor(Math.random() * statuses.length)];
                    if (i < 3) status = 'Checked-in';
                    if (i > 7 && i < 10) status = 'Pending';
                    var b = {
                        id: AppState.genId(),
                        customerId: customer.id,
                        roomId: room.id,
                        checkin: checkin.toISOString().split('T')[0],
                        checkout: checkout.toISOString().split('T')[0],
                        status: status,
                        date: checkin.toISOString().split('T')[0]
                    };
                    bookings.push(b);

                    if (status !== 'Cancelled' && Math.random() > 0.3) {
                        var total = calculateBookingTotal(b, { rooms: rooms });
                        var paidAmount = total * (0.5 + Math.random() * 0.5);
                        var payStatus = 'Paid';
                        if (paidAmount < total) payStatus = 'Partially Paid';
                        if (status === 'Checked-out' && Math.random() > 0.6) payStatus = 'Unpaid';
                        payments.push({
                            id: AppState.genId(),
                            bookingId: b.id,
                            amount: Math.round(paidAmount * 100) / 100,
                            method: paymentMethods[Math.floor(Math.random() * paymentMethods.length)],
                            status: payStatus === 'Partially Paid' ? 'Partial' : payStatus,
                            date: b.checkin
                        });
                    }
                }

                AppState.set({ rooms: rooms, customers: customers, bookings: bookings, payments: payments });
                AppState.save();
            }
        };

// API CLIENT
// ============================================================

const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
const TOKEN_URL = 'http://127.0.0.1:8000/api/token';
const REFRESH_URL = 'http://127.0.0.1:8000/api/token/refresh';

let refreshPromise = null;
let isRefreshing = false;
let pendingRequests = [];

class ApiClient {
    constructor() {
        this.baseURL = API_BASE_URL;
        this.accessToken = localStorage.getItem('hms_access_token') || null;
        this.refreshToken = localStorage.getItem('hms_refresh_token') || null;
    }

    setTokens(access, refresh) {
        this.accessToken = access;
        this.refreshToken = refresh;
        if (access) localStorage.setItem('hms_access_token', access);
        else localStorage.removeItem('hms_access_token');
        if (refresh) localStorage.setItem('hms_refresh_token', refresh);
        else localStorage.removeItem('hms_refresh_token');
    }

    clearTokens() {
        this.accessToken = null;
        this.refreshToken = null;
        localStorage.removeItem('hms_access_token');
        localStorage.removeItem('hms_refresh_token');
    }

    getHeaders(includeAuth = true) {
        const headers = {
            'Content-Type': 'application/json',
        };
        if (includeAuth && this.accessToken) {
            headers['Authorization'] = `Bearer ${this.accessToken}`;
        }
        return headers;
    }

    async request(method, endpoint, data = null, includeAuth = true, retry = true) {
        const url = `${this.baseURL}${endpoint}`;
        const options = {
            method,
            headers: this.getHeaders(includeAuth),
        };
        if (data) {
            options.body = JSON.stringify(data);
        }

        try {
            const response = await fetch(url, options);

            // 401 → refresh → retry
            if (response.status === 401 && includeAuth && retry) {
                const refreshed = await this.refreshTokenFlow();
                if (refreshed) {
                    return this.request(method, endpoint, data, includeAuth, false);
                } else {
                    this.clearTokens();
                    Auth.logout();
                    throw new Error('Session expired. Please login again.');
                }
            }

            // 204 No Content → return null
            if (response.status === 204) {
                return null;
            }

            const responseData = await response.json();

            if (!response.ok) {
                throw {
                    status: response.status,
                    data: responseData,
                    message: responseData.error?.message || responseData.detail || 'Request failed',
                };
            }

            return responseData;
        } catch (error) {
            if (error instanceof TypeError && error.message === 'Failed to fetch') {
                throw { message: 'Network error. Please check your connection.' };
            }
            throw error;
        }
    }

    async refreshTokenFlow() {
        // Prevent multiple refresh requests
        if (isRefreshing) {
            return new Promise((resolve) => {
                pendingRequests.push(resolve);
            });
        }

        isRefreshing = true;
        refreshPromise = null;

        try {
            if (!this.refreshToken) {
                throw new Error('No refresh token available');
            }

            const response = await fetch(REFRESH_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: this.refreshToken }),
            });

            if (!response.ok) {
                throw new Error('Refresh failed');
            }

            const data = await response.json();
            this.setTokens(data.access, this.refreshToken);

            // Resolve all pending requests
            pendingRequests.forEach(resolve => resolve(true));
            pendingRequests = [];

            return true;
        } catch (error) {
            this.clearTokens();
            pendingRequests.forEach(resolve => resolve(false));
            pendingRequests = [];
            return false;
        } finally {
            isRefreshing = false;
        }
    }

    // ===== CRUD Helpers =====
    async get(endpoint, includeAuth = true) {
        return this.request('GET', endpoint, null, includeAuth);
    }

    async post(endpoint, data, includeAuth = true) {
        return this.request('POST', endpoint, data, includeAuth);
    }

    async put(endpoint, data, includeAuth = true) {
        return this.request('PUT', endpoint, data, includeAuth);
    }

    async patch(endpoint, data, includeAuth = true) {
        return this.request('PATCH', endpoint, data, includeAuth);
    }

    async delete(endpoint, includeAuth = true) {
        return this.request('DELETE', endpoint, null, includeAuth);
    }
}

const apiClient = new ApiClient();

const roomService = {
    _pagination: {
        count: 0,
        next: null,
        previous: null,
        currentPage: 1,
        pageSize: 25,
    },

    getPagination() {
        return this._pagination;
    },

    async getRooms(page = 1) {
        try {
            const endpoint = `/rooms/?page=${page}`;
            const response = await apiClient.get(endpoint);

            // Update pagination metadata
            this._pagination = {
                count: response.count || 0,
                next: response.next,
                previous: response.previous,
                currentPage: page,
                pageSize: 25,
            };

            return response.results || [];
        } catch (error) {
            throw error;
        }
    },

    async getRoom(id) {
        try {
            const response = await apiClient.get(`/rooms/${id}/`);
            return response;
        } catch (error) {
            throw error;
        }
    },

    async createRoom(data) {
        try {
            const response = await apiClient.post('/rooms/', data);
            return response;
        } catch (error) {
            throw error;
        }
    },

    async updateRoom(id, data) {
        try {
            const response = await apiClient.put(`/rooms/${id}/`, data);
            return response;
        } catch (error) {
            throw error;
        }
    },

    async deleteRoom(id) {
        try {
            // DELETE returns 204 No Content
            await apiClient.delete(`/rooms/${id}/`);
            return true;
        } catch (error) {
            throw error;
        }
    },
};
