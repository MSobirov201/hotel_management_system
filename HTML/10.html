const AuthService = {
    _authState: null, // NO_TOKEN | VALID_ACCESS | EXPIRED | REFRESH_FAILED | AUTHENTICATED | UNAUTHENTICATED

    getAuthState() {
        return this._authState;
    },

    async login(username, password) {
        try {
            const response = await fetch(TOKEN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            if (!response.ok) {
                const data = await response.json();
                throw {
                    status: response.status,
                    message: data.detail || 'Invalid username or password',
                };
            }

            const data = await response.json();
            apiClient.setTokens(data.access, data.refresh);
            this._authState = 'AUTHENTICATED';

            return { success: true, data };
        } catch (error) {
            this._authState = 'UNAUTHENTICATED';
            throw error;
        }
    },

    logout() {
        apiClient.clearTokens();
        this._authState = 'UNAUTHENTICATED';
        // Clear AppState data
        if (AppState && AppState.data) {
            AppState.data = { rooms: [], customers: [], bookings: [], payments: [], notifications: [] };
        }
        // Redirect to login
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
    },

    check() {
        const access = localStorage.getItem('hms_access_token');
        const refresh = localStorage.getItem('hms_refresh_token');

        if (!access) {
            this._authState = 'NO_TOKEN';
            return false;
        }

        // Check if token is expired (simple check based on JWT structure)
        try {
            const payload = JSON.parse(atob(access.split('.')[1]));
            const exp = payload.exp * 1000; // convert to milliseconds
            if (Date.now() > exp) {
                // Token expired, but refresh might be available
                if (refresh) {
                    this._authState = 'ACCESS_EXPIRED_REFRESH_AVAILABLE';
                    // We'll attempt refresh on first API call
                    return true; // still considered authenticated until refresh fails
                } else {
                    this._authState = 'UNAUTHENTICATED';
                    return false;
                }
            }
            this._authState = 'VALID_ACCESS';
            return true;
        } catch (e) {
            this._authState = 'UNAUTHENTICATED';
            return false;
        }
    },

    isAuthenticated() {
        return this.check() && this._authState !== 'UNAUTHENTICATED';
    }
};

var Auth = {
    // Keep existing methods for backward compatibility, but redirect to AuthService
    hashPassword: function(pwd) {
        // Keep for backward compatibility (reset password, etc.)
        var hash = 0;
        for (var i = 0; i < pwd.length; i++) {
            var char = pwd.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return 'h_' + Math.abs(hash).toString(36);
    },

    isLoggedIn: function() {
        return AuthService.isAuthenticated();
    },

    login: async function(username, password, remember) {
        try {
            const result = await AuthService.login(username, password);
            if (remember) {
                localStorage.setItem('hms_remember', 'true');
                localStorage.setItem('hms_user', username);
            } else {
                localStorage.removeItem('hms_remember');
                localStorage.removeItem('hms_user');
            }
            return true;
        } catch (error) {
            Toast.error(error.message || 'Login failed');

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var username = document.getElementById('loginUsername').value;
    var password = document.getElementById('loginPassword').value;
    var remember = document.getElementById('loginRemember').checked;

    // Show loading state
    var submitBtn = this.querySelector('button[type="submit"]');
    var originalText = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kirish...';

    try {
        var success = await Auth.login(username, password, remember);
        if (success) {
            var loginPage = document.getElementById('loginPage');
            if (loginPage) {
                loginPage.classList.add('fade-out');
                setTimeout(function() { window.location.reload(); }, 500);
            } else {
                window.location.reload();
            }
        }
    } catch (error) {
        Toast.error(error.message || 'Login failed');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
});
