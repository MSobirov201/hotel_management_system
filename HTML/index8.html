<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Hotel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        /* ===== ROOT ===== */
        :root {
            --glass-blur-sm: blur(12px) saturate(160%);
            --glass-blur-md: blur(18px) saturate(160%);
            --glass-blur-lg: blur(22px) saturate(170%);
            --glass-fill-dark: rgba(255, 255, 255, 0.055);
            --glass-fill-hover: rgba(255, 255, 255, 0.09);
            --glass-b-top: rgba(255, 255, 255, 0.25);
            --glass-b-left: rgba(255, 255, 255, 0.10);
            --glass-b-right: rgba(0, 0, 0, 0.08);
            --glass-b-bottom: rgba(0, 0, 0, 0.20);
            --glass-shadow-md: 0 1px 0 rgba(255, 255, 255, 0.10) inset, 0 -1px 0 rgba(0, 0, 0, 0.12) inset, 0 16px 48px rgba(0, 0, 0, 0.38), 0 4px 12px rgba(0, 0, 0, 0.18);
            --glass-shadow-lg: 0 1px 0 rgba(255, 255, 255, 0.12) inset, 0 -1px 0 rgba(0, 0, 0, 0.14) inset, 0 32px 80px rgba(0, 0, 0, 0.45), 0 8px 24px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(255, 255, 255, 0.06);
            --glass-shadow-hover: 0 1px 0 rgba(255, 255, 255, 0.16) inset, 0 -1px 0 rgba(0, 0, 0, 0.10) inset, 0 40px 100px rgba(0, 0, 0, 0.5), 0 8px 28px rgba(0, 0, 0, 0.25), 0 0 80px rgba(99, 102, 241, 0.10);
            --glass-fill-light: rgba(255, 255, 255, 0.55);
            --glass-fill-light-hover: rgba(255, 255, 255, 0.72);
            --glass-b-top-light: rgba(255, 255, 255, 0.92);
            --glass-b-left-light: rgba(255, 255, 255, 0.68);
            --glass-b-right-light: rgba(255, 255, 255, 0.40);
            --glass-b-bottom-light: rgba(0, 0, 0, 0.05);
            --glass-shadow-light: 0 1px 0 rgba(255, 255, 255, 0.92) inset, 0 -1px 0 rgba(0, 0, 0, 0.03) inset, 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
            --bg-primary: #070B17;
            --bg-secondary: rgba(15, 23, 42, 0.7);
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --text-body: #E2E8F0;
            --accent-1: #5B5FFF;
            --accent-2: #7C3AED;
            --accent-3: #3B82F6;
            --accent-4: #EC4899;
            --accent-5: #F59E0B;
            --accent-6: #10B981;
            --accent-gradient: linear-gradient(135deg, #5B5FFF 0%, #7C3AED 100%);
            --accent-gradient-2: linear-gradient(135deg, #EC4899 0%, #7C3AED 100%);
            --accent-gradient-3: linear-gradient(135deg, #3B82F6 0%, #06B6D4 100%);
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --color-danger: #EF4444;
            --color-info: #06B6D4;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            --card-shadow-hover: 0 16px 56px rgba(0, 0, 0, 0.25);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.08);
            --input-focus: #5B5FFF;
            --input-text: #F1F5F9;
            --radius-sm: 14px;
            --radius-md: 20px;
            --radius-lg: 26px;
            --radius-xl: 34px;
            --radius-full: 9999px;
            --font-family: -apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif;
            --font-base: 0.95rem;
            --transition: 1.6s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-smooth: 1.0s cubic-bezier(0.4, 0, 0.2, 1);
            --z-sidebar: 1050;
            --z-overlay: 1040;
            --z-navbar: 100;
            --z-dropdown: 2000;
            --z-notification: 9999999;
            --z-modal: 999999;
            --z-toast: 99999;
            --z-bottom-nav: 1040;
            --btn-height: 48px;
            --input-height: 48px;
            --card-padding: 1.25rem;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --backdrop-blur-mobile: 14px;
            --backdrop-blur-tablet: 18px;
            --backdrop-blur-desktop: 22px;
        }

        [data-theme="light"] {
            --bg-primary: #F0F4FC;
            --bg-secondary: rgba(255, 255, 255, 0.3);
            --text-primary: #0A1628;
            --text-secondary: #1E293B;
            --text-muted: #475569;
            --text-body: #1E293B;
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(255, 255, 255, 0.55);
            --input-bg: rgba(255, 255, 255, 0.85);
            --input-border: rgba(0, 0, 0, 0.10);
            --input-text: #0A1628;
            --accent-1: #4F46E5;
            --accent-2: #7C3AED;
            --accent-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            --glass-fill-light: rgba(255, 255, 255, 0.55);
            --glass-fill-light-hover: rgba(255, 255, 255, 0.75);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --card-shadow-hover: 0 12px 40px rgba(79, 70, 229, 0.08);
            --glass-shadow-md: 0 1px 0 rgba(255, 255, 255, 0.92) inset, 0 -1px 0 rgba(0, 0, 0, 0.03) inset, 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
            --glass-shadow-hover: 0 1px 0 rgba(255, 255, 255, 0.95) inset, 0 -1px 0 rgba(0, 0, 0, 0.02) inset, 0 12px 40px rgba(79, 70, 229, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.6s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
            overflow-x: clip;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
            transition: opacity 0.8s ease;
        }
        [data-theme="dark"] body::before {
            width: 50vw;
            height: 40vh;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
        }
        [data-theme="dark"] body::after {
            width: 40vw;
            height: 35vh;
            bottom: -5%;
            right: -5%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.10) 0%, transparent 70%);
        }
        [data-theme="light"] body::before {
            width: 60vw;
            height: 50vh;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.06) 0%, transparent 70%);
        }
        [data-theme="light"] body::after {
            width: 40vw;
            height: 35vh;
            bottom: 0;
            right: -5%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.05) 0%, transparent 70%);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.22);
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.4);
        }
        [data-theme="light"] ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.18);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(99, 102, 241, 0.18) transparent;
        }

        input,
        select,
        textarea {
            font-size: max(16px, 0.9rem) !important;
        }
        @media (max-width: 768px) {
            .form-control,
            .form-select,
            input[type="text"],
            input[type="password"],
            input[type="email"],
            input[type="number"],
            textarea {
                font-size: 16px !important;
            }
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset !important;
            -webkit-text-fill-color: var(--input-text) !important;
            caret-color: var(--input-text) !important;
            transition: background-color 9999s ease 0s;
        }

        /* ===== GLASS CARD ===== */
        .glass-card {
            position: relative;
            overflow: visible !important;
            border-radius: var(--radius-lg);
            padding: var(--card-padding);
            color: var(--text-primary);
            height: 100%;
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
            will-change: auto;
            backdrop-filter: blur(var(--backdrop-blur-desktop)) saturate(140%);
            -webkit-backdrop-filter: blur(var(--backdrop-blur-desktop)) saturate(140%);
        }
        [data-theme="dark"] .glass-card {
            background: var(--glass-fill-dark);
            border-top: 1px solid var(--glass-b-top);
            border-left: 1px solid var(--glass-b-left);
            border-right: 1px solid var(--glass-b-right);
            border-bottom: 1px solid var(--glass-b-bottom);
            box-shadow: var(--glass-shadow-md);
        }
        [data-theme="light"] .glass-card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 0 rgba(255, 255, 255, 0.95) inset;
            color: #0A1628;
        }

        [data-theme="dark"] .glass-card:hover {
            background: var(--glass-fill-hover);
            box-shadow: var(--glass-shadow-hover);
            transform: translateY(-6px) scale(1.008);
            backdrop-filter: blur(calc(var(--backdrop-blur-desktop)+4px)) saturate(170%);
            -webkit-backdrop-filter: blur(calc(var(--backdrop-blur-desktop)+4px)) saturate(170%);
            transition-duration: 1.6s;
            transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        [data-theme="light"] .glass-card:hover {
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 12px 40px rgba(79, 70, 229, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
            transform: translateY(-4px) scale(1.005);
            backdrop-filter: blur(calc(var(--backdrop-blur-desktop)+4px)) saturate(170%);
            -webkit-backdrop-filter: blur(calc(var(--backdrop-blur-desktop)+4px)) saturate(170%);
            transition-duration: 1.6s;
            transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 768px) {
            .glass-card {
                backdrop-filter: blur(var(--backdrop-blur-mobile)) saturate(140%) !important;
                -webkit-backdrop-filter: blur(var(--backdrop-blur-mobile)) saturate(140%) !important;
                transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.8s ease, background 0.8s ease;
                padding: 1rem !important;
            }
            [data-theme="dark"] .glass-card:hover,
            [data-theme="light"] .glass-card:hover {
                backdrop-filter: blur(calc(var(--backdrop-blur-mobile)+4px)) saturate(160%) !important;
                -webkit-backdrop-filter: blur(calc(var(--backdrop-blur-mobile)+4px)) saturate(160%) !important;
                transform: translateY(-3px) scale(1.01);
                transition-duration: 0.8s;
            }
        }

        /* ===== LOGIN ===== */
        .login-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 1.5rem;
            animation: loginFadeIn 2s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            overflow-y: auto !important;
            position: relative;
        }
        @keyframes loginFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes loginFadeOut {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 0;
                transform: scale(0.96) translateY(-20px);
            }
        }
        .login-page.fade-out {
            animation: loginFadeOut 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2.5rem 2rem;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow-hover);
            color: var(--text-primary);
            backdrop-filter: blur(var(--backdrop-blur-desktop)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--backdrop-blur-desktop)) saturate(160%);
            margin: auto;
            animation: loginGlow 2s ease-in-out infinite alternate;
        }
        @keyframes loginGlow {
            0% { box-shadow: 0 0 30px rgba(91,95,255,0.1); }
            100% { box-shadow: 0 0 60px rgba(91,95,255,0.3); }
        }
        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.06);
            color: #0A1628;
        }
        .login-card .logo h2 {
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        [data-theme="light"] .login-card .logo p {
            color: #475569;
        }

        /* ===== DARK MODE FORM CONTROLS ===== */
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #F1F5F9 !important;
            border-radius: var(--radius-full) !important;
            padding: 0.6rem 1.2rem !important;
            min-height: var(--input-height) !important;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        [data-theme="dark"] .form-control:focus,
        [data-theme="dark"] .form-select:focus {
            border-color: var(--accent-1) !important;
            box-shadow: 0 0 0 4px rgba(91, 95, 255, 0.15) !important;
            background: rgba(255, 255, 255, 0.12) !important;
        }

        [data-theme="dark"] .login-card .form-control {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #F1F5F9 !important;
            border-radius: var(--radius-full) !important;
            padding: 0.6rem 1.2rem !important;
            min-height: var(--input-height) !important;
        }
        [data-theme="dark"] .login-card .form-control:focus {
            border-color: var(--accent-1) !important;
            box-shadow: 0 0 0 4px rgba(91, 95, 255, 0.15) !important;
        }

        /* ===== LIGHT MODE PRIMARY BUTTON ===== */
        [data-theme="light"] .btn-glass-primary {
            background: var(--accent-gradient) !important;
            color: #fff !important;
            border: none !important;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.30) !important;
        }
        [data-theme="light"] .btn-glass-primary:hover {
            box-shadow: 0 6px 28px rgba(79, 70, 229, 0.45) !important;
            transform: translateY(-2px) scale(1.03) !important;
        }
        [data-theme="light"] .btn-glass-primary:active {
            transform: scale(0.95) !important;
        }

        /* ===== NOTIFICATION DROPDOWN ===== */
        .notif-dropdown {
            background: rgba(10, 14, 28, 0.92) !important;
            backdrop-filter: blur(var(--backdrop-blur-lg)) saturate(180%) !important;
            -webkit-backdrop-filter: blur(var(--backdrop-blur-lg)) saturate(180%) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }
        [data-theme="light"] .notif-dropdown {
            background: rgba(255, 255, 255, 0.96) !important;
            border-color: rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04) !important;
        }
        .notif-item {
            background: rgba(255, 255, 255, 0.03) !important;
            border-bottom-color: rgba(255, 255, 255, 0.05) !important;
        }
        .notif-item:hover {
            background: rgba(255, 255, 255, 0.06) !important;
        }
        [data-theme="light"] .notif-item {
            background: transparent !important;
            border-bottom-color: rgba(0, 0, 0, 0.05) !important;
        }
        [data-theme="light"] .notif-item:hover {
            background: rgba(79, 70, 229, 0.04) !important;
        }
        [data-theme="light"] .notif-header {
            background: rgba(248, 250, 255, 0.7);
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .notif-filters {
            background: rgba(248, 250, 255, 0.7);
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .notif-search {
            background: rgba(248, 250, 255, 0.6);
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }
        [data-theme="light"] .notif-load-more {
            background: rgba(248, 250, 255, 0.7);
        }

        /* ===== DISABLE HOVER TRANSFORM ON TOUCH ===== */
        @media (hover: none) {
            .glass-card:hover {
                transform: none !important;
            }
            .btn-glass:hover {
                transform: none !important;
            }
            .filter-btn:hover {
                transform: none !important;
            }
            .sidebar .nav-link:hover {
                transform: none !important;
            }
            .mob-nav-item:not(.active):hover i {
                transform: none !important;
            }
            *:active {
                transform: none !important;
            }
        }

        /* ===== MOBILE PDF/EXCEL/PRINT ===== */
        @media (max-width: 576px) {
            #page-reports .d-flex.gap-2.flex-wrap {
                flex-wrap: wrap !important;
                overflow-x: visible !important;
                padding-bottom: 0.3rem;
                gap: 0.4rem !important;
                display: flex !important;
                width: 100% !important;
            }
            #page-reports .btn-glass {
                flex: 1 1 calc(33% - 0.4rem) !important;
                min-width: 80px !important;
                font-size: 0.72rem !important;
                padding: 0.25rem 0.5rem !important;
                min-height: 36px !important;
            }
            #page-reports .btn-glass i {
                margin-right: 0.2rem !important;
            }
        }

        /* ===== SETTINGS & PROFILE INPUTS ===== */
        [data-theme="dark"] #settingsForm .form-control,
        [data-theme="dark"] #profileForm .form-control,
        [data-theme="dark"] #profilePassword {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #F1F5F9 !important;
            border-radius: var(--radius-full) !important;
        }
        [data-theme="dark"] #settingsForm .form-control:focus,
        [data-theme="dark"] #profileForm .form-control:focus,
        [data-theme="dark"] #profilePassword:focus {
            border-color: var(--accent-1) !important;
            box-shadow: 0 0 0 4px rgba(91, 95, 255, 0.15) !important;
        }

        /* ===== RESET PASSWORD / CLEAR STORAGE ===== */
        .reset-password-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
            text-decoration: underline;
            opacity: 0.6;
        }
        .reset-password-btn:hover {
            color: var(--accent-1);
            opacity: 1;
        }
        [data-theme="light"] .reset-password-btn {
            color: #64748B;
        }
        [data-theme="light"] .reset-password-btn:hover {
            color: var(--accent-1);
        }

        .clear-storage-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.6rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
            opacity: 0.3;
        }
        .clear-storage-btn:hover {
            opacity: 0.7;
            color: var(--color-danger);
        }

        #app {
            display: flex;
            min-height: 100vh;
            animation: appFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes appFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .main-content {
            flex: 1;
            padding: 0.8rem 1.2rem 5.5rem;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(5.5rem + var(--safe-bottom));
        }

        /* ===== PROFILE & SETTINGS WIDTH ===== */
        #page-profile .glass-card,
        #page-settings .glass-card {
            max-width: 800px !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }

        /* ===== MOBILE MAIN CONTENT PADDING FIX ===== */
        @media (max-width: 576px) {
            .main-content {
                padding: 0.8rem 0.8rem 5.5rem !important;
            }
            .dashboard-stats {
                grid-template-columns: 1fr 1fr !important;
                gap: 0.5rem !important;
            }

        // ================================================================
        // XAVFSIZLIK: escapeHtml
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            var map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function getCurrencyRates() {
            try {

                }
            } catch (e) {}
            return { USD: 1, EUR: 0.92, UZS: 12700 };
        }

        function formatCurrency(amountInUSD, forceCurrency) {
            var state = AppState ? AppState.get() : null;
            var curr = forceCurrency || state?.currency || 'USD';
            var amount = parseFloat(amountInUSD) || 0;
            var rates = getCurrencyRates();
            var rate = rates[curr] || 1;
            var converted = amount * rate;
            if (curr === 'UZS') {
                return new Intl.NumberFormat('uz-UZ').format(Math.round(converted)) + ' so\'m';
            }
            if (curr === 'EUR') {
                return '\u20AC' + converted.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            }
            return '$' + converted.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function getRelativeTime(timestamp) {
            var now = Date.now();
            var diff = now - timestamp;
            var s = Math.floor(diff / 1000);
            var m = Math.floor(s / 60);
            var h = Math.floor(m / 60);
            var d = Math.floor(h / 24);
            var lang = Lang?.current || 'uz';
            var tbl = {
                uz: { now: 'Hozirgina', m: function(n) { return n + ' daqiqa oldin'; }, h: function(n) { return n +
                            ' soat oldin'; }, d: function(n) { return n + ' kun oldin'; } },
                en: { now: 'Just now', m: function(n) { return n + 'm ago'; }, h: function(n) { return n + 'h ago'; },
                    d: function(n) { return n + 'd ago'; } },
                ru: { now: 'Только что', m: function(n) { return n + ' мин. назад'; }, h: function(n) { return n +
                            ' ч. назад'; }, d: function(n) { return n + ' дн. назад'; } }
            };
            var t = tbl[lang] || tbl.uz;
            if (s < 60) return t.now;
            if (m < 60) return t.m(m);
            if (h < 24) return t.h(h);
            if (d < 7) return t.d(d);
            return new Date(timestamp).toLocaleDateString(lang === 'ru' ? 'ru-RU' : lang === 'en' ? 'en-US' : 'uz-UZ');
        }

        function getStatusKey(status) {
            var map = {
                'Available': 'available',
                'Booked': 'booked',
                'Occupied': 'occupied',
                'Maintenance': 'cancelled',
                'Checked-in': 'active',
                'Checked-out': 'completed',
                'Pending': 'pending',
                'Cancelled': 'cancelled',
                'Paid': 'paid',
                'Unpaid': 'unpaid',
                'Refunded': 'cancelled',
                'Partially Paid': 'partial'
            };
            return map[status] || 'pending';
        }

        function calculateBookingTotal(booking, state) {
            var room = state.rooms.find(function(r) { return r.id === booking.roomId; });
            if (!room) return 0;
            var checkin = new Date(booking.checkin);
            var checkout = new Date(booking.checkout);
            var days = Math.max(1, Math.ceil((checkout - checkin) / (1000 * 60 * 60 * 24)));
            return room.price * days;
        }

        function getBookingPaymentStatus(booking, state) {
            var payments = state.payments.filter(function(p) { return p.bookingId === booking.id; });
            var totalPaid = payments.reduce(function(sum, p) { return sum + (p.status === 'Paid' ? p.amount : 0); }, 0);
            var totalPrice = calculateBookingTotal(booking, state);
            if (totalPaid === 0) return { status: 'Unpaid', paid: 0, remaining: totalPrice, total: totalPrice };
            if (totalPaid >= totalPrice) return { status: 'Paid', paid: totalPaid, remaining: 0, total: totalPrice };
            return { status: 'Partially Paid', paid: totalPaid, remaining: totalPrice - totalPaid, total: totalPrice };
        }

        function applyStagger(selector, delay) {
            if (delay === undefined) delay = 50;
            document.querySelectorAll(selector).forEach(function(el, i) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px) scale(0.97)';
                el.style.transition =
                    'opacity 0.35s ease ' + (i * delay) + 'ms, transform 0.35s cubic-bezier(0.34,1.56,0.64,1) ' + (i *
                        delay) + 'ms';
                requestAnimationFrame(function() {
                    setTimeout(function() {
                        el.style.opacity = '1';
                        el.style.transform = 'none';
                    }, 10);
                });
            });
        }

        // ===== DEBOUNCE =====
        function debounce(fn, delay) {
            if (delay === undefined) delay = 250;
            var timer = null;
            return function() {
                var args = arguments;
                var context = this;
                clearTimeout(timer);
                timer = setTimeout(function() { fn.apply(context, args); }, delay);
            };
        }

        // ================================================================

        var Auth = {
            hashPassword: function(pwd) {
                var hash = 0;
                for (var i = 0; i < pwd.length; i++) {
                    var char = pwd.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return 'h_' + Math.abs(hash).toString(36);
            },
            isLoggedIn: function() { return localStorage.getItem('hms_logged_in') === 'true' || sessionStorage.getItem(
                    'hms_logged_in') === 'true'; },
            login: function(username, password, remember) {
                var storedHash = localStorage.getItem('hms_password_hash');
                if (!storedHash) {
                    storedHash = this.hashPassword('admin123');
                    localStorage.setItem('hms_password_hash', storedHash);
                }
                var inputHash = this.hashPassword(password);
                if (username === 'admin' && inputHash === storedHash) {
                    if (remember) {
                        localStorage.setItem('hms_logged_in', 'true');
                        localStorage.setItem('hms_remember', 'true');
                        localStorage.setItem('hms_user', username);
                    } else {
                        sessionStorage.setItem('hms_logged_in', 'true');
                        localStorage.removeItem('hms_remember');
                        localStorage.removeItem('hms_user');
                    }
                    return true;
                }
                return false;
            },
            resetPassword: function() {
                var defaultHash = this.hashPassword('admin123');
                localStorage.setItem('hms_password_hash', defaultHash);
                localStorage.removeItem('hms_logged_in');
                sessionStorage.removeItem('hms_logged_in');
                Toast.success('Parol default holatga qaytarildi: admin123');
                setTimeout(function() { window.location.reload(); }, 500);
            },
            clearStorage: function() {
                localStorage.clear();
                sessionStorage.clear();
                Toast.success('Barcha ma\'lumotlar tozalandi. Sahifa yangilanadi...');
                setTimeout(function() { window.location.reload(); }, 500);
            },
            logout: function() {
                localStorage.removeItem('hms_logged_in');
                localStorage.removeItem('hms_remember');
                localStorage.removeItem('hms_user');
                sessionStorage.removeItem('hms_logged_in');
                var app = document.getElementById('app');
                if (app) {
                    app.style.animation = 'loginFadeOut 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                    setTimeout(function() { window.location.reload(); }, 500);
                } else {
                    window.location.reload();
                }
            },
            check: function() { return this.isLoggedIn(); }
        };

        // ================================================================
        // APP STATE
        // ================================================================
        var AppState = {
            data: { rooms: [], customers: [], bookings: [], payments: [], notifications: [], theme: 'dark',
                language: 'uz', currentPage: 'dashboard', currency: 'USD' },
            load: function() {
                try {
                    var saved = localStorage.getItem('hms_state');
                    if (saved) this.data = { ...this.data, ...JSON.parse(saved) };
                    this.data.rooms = JSON.parse(localStorage.getItem('hms_rooms')) || [];
                    this.data.customers = JSON.parse(localStorage.getItem('hms_customers')) || [];
                    this.data.bookings = JSON.parse(localStorage.getItem('hms_bookings')) || [];
                    this.data.payments = JSON.parse(localStorage.getItem('hms_payments')) || [];
                    this.data.notifications = JSON.parse(localStorage.getItem('hms_notifications')) || [];
                    var settings = JSON.parse(localStorage.getItem('hms_settings')) || {};
                    this.data.currency = settings.currency || 'USD';
                    if (!localStorage.getItem('hms_password_hash')) {
                        localStorage.setItem('hms_password_hash', Auth.hashPassword('admin123'));
                    }

                    // Clean old bookings (older than 30 days) and move to history
                    var now = Date.now();
                    var thirtyDays = 30 * 24 * 60 * 60 * 1000;
                    var history = JSON.parse(localStorage.getItem('hms_history')) || [];
                    var newBookings = [];
                    this.data.bookings.forEach(function(b) {
                        var checkoutTime = new Date(b.checkout + 'T00:00:00').getTime();
                        if ((b.status === 'Checked-out' || b.status === 'Cancelled') && (now - checkoutTime > thirtyDays)) {
                            history.push({ booking: b, removedAt: new Date().toISOString() });
                        } else {
                            newBookings.push(b);
                        }
                    });
                    this.data.bookings = newBookings;
                    localStorage.setItem('hms_history', JSON.stringify(history));

                    // Clean old payments (older than 30 days) - only if booking is already removed
                    var paymentIds = this.data.bookings.map(function(b) { return b.id; });
                    this.data.payments = this.data.payments.filter(function(p) {
                        return paymentIds.includes(p.bookingId);
                    });

                    // Clean old notifications (older than 90 days)
                    var ninetyDays = 90 * 24 * 60 * 60 * 1000;
                    this.data.notifications = this.data.notifications.filter(function(n) {
                        return (now - n.time) < ninetyDays;
                    });

                    this.save();
                } catch (e) { console.warn(e); }
            },
            save: function() {
                try {
                    localStorage.setItem('hms_state', JSON.stringify({ theme: this.data.theme, language: this.data
                            .language, currentPage: this.data.currentPage }));
                    localStorage.setItem('hms_rooms', JSON.stringify(this.data.rooms));
                    localStorage.setItem('hms_customers', JSON.stringify(this.data.customers));
                    localStorage.setItem('hms_bookings', JSON.stringify(this.data.bookings));
                    localStorage.setItem('hms_payments', JSON.stringify(this.data.payments));
                    localStorage.setItem('hms_notifications', JSON.stringify(this.data.notifications));
                } catch (e) { console.warn(e); }
            },
            get: function() { return this.data; },
            set: function(newData) { this.data = { ...this.data, ...newData };
                this.save(); },
            genId: function() { return Date.now() + Math.random().toString(36).substr(2, 6); },
            addNotification: function(message, type, category) {
                if (type === undefined) type = 'info';
                if (category === undefined) category = 'system';
                var notif = { id: this.genId(), message: escapeHtml(message), type: type, category: category,
                    time: Date.now(), read: false };
                this.data.notifications.unshift(notif);
                if (this.data.notifications.length > 200) this.data.notifications = this.data.notifications.slice(0,
                200);
                this.save();
                return notif;
            },
            // Backendga tayyorlash uchun API metodlari (hozircha localStorage)
            api: {
                fetch: function() { AppState.load(); return AppState.get(); },
                save: function(data) { AppState.set(data); },
                sync: function() {
                    // Kelajakda serverga so'rov yuborish mumkin
                    return Promise.resolve(AppState.get());
                }
            }
        };

                if (titleEl && iconMap[currentPage]) {
                    titleEl.innerHTML = '<i class="fas ' + iconMap[currentPage] + '"></i>';
                }
                var exportBtn = document.getElementById('exportDataBtn');
                if (exportBtn) {
                    var span = exportBtn.querySelector('span');
                    if (span) span.textContent = Lang.t('export_data');
                }
                var importBtn = document.getElementById('importDataBtn');
                if (importBtn) {
                    var span = importBtn.querySelector('span');
                    if (span) span.textContent = Lang.t('import_data');
                }
                var historyTitle = document.getElementById('historyTitle');
                if (historyTitle) historyTitle.textContent = Lang.t('history');
            },
            updateNotificationFilterLabels: function() {
                var filters = document.querySelectorAll('#notifFilters .filter-btn');
                var filterMap = {
                    'all': 'filter_all',
                    'unread': 'filter_unread',
                    'booking': 'filter_booking',
                    'payment': 'filter_payment',
                    'customer': 'filter_customer',
                    'system': 'filter_system'
                };
                filters.forEach(function(btn) {
                    var key = btn.dataset.filter;
                    if (filterMap[key]) {
                        var text = Lang.t(filterMap[key]);
                        var icon = btn.querySelector('i');
                        if (icon) {
                            btn.innerHTML = '';
                            btn.appendChild(icon);
                            btn.appendChild(document.createTextNode(' ' + text));
                        } else {
                            btn.textContent = text;
                        }
                    }
                });
            },
            set: function(lang) {
                if (T[lang]) {
                    this.current = lang;
                    localStorage.setItem('hms_lang', lang);
                    AppState.set({ language: lang });
                    this.apply();
                    App.renderPage(AppState.get().currentPage);
                }
            }
        };

        // ================================================================
        // THEME
        // ================================================================
        var Theme = {
            current: 'dark',
            apply: function(theme) {
                this.current = theme || this.current;
                document.documentElement.setAttribute('data-theme', this.current);
                localStorage.setItem('hms_theme', this.current);
                AppState.set({ theme: this.current });
                var icon = document.querySelector('#themeToggle i');
                if (icon) icon.className = this.current === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                var cb = document.getElementById('settingsDarkMode');
                if (cb) cb.checked = this.current === 'dark';
                var page = AppState.get().currentPage;
                if (page === 'dashboard' || page === 'reports' || page === 'settings') {
                    setTimeout(function() { App.renderPage(page); }, 60);
                }
                if (page === 'settings') {
                    setTimeout(function() { App.renderSettings(); }, 80);
                }
            },
            toggle: function() { this.apply(this.current === 'dark' ? 'light' : 'dark'); },
            init: function() { this.apply(localStorage.getItem('hms_theme') || 'dark'); }
        };

        // ================================================================
        // TOAST
        // ================================================================
        var Toast = {
            container: null,
            init: function() { this.container = document.getElementById('toast-container'); },
            show: function(msg, type) {
                if (type === undefined) type = 'info';
                var div = document.createElement('div');
                var icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle' };
                div.className = 'toast-msg ' + type;
                div.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + escapeHtml(msg);
                this.container.appendChild(div);
                setTimeout(function() {
                    div.classList.add('fade-out');
                    setTimeout(function() { div.remove(); }, 300);
                }, 4000);
            },
            success: function(m) { this.show(m, 'success'); },
            error: function(m) { this.show(m, 'error'); },
            warning: function(m) { this.show(m, 'warning'); },
            info: function(m) { this.show(m, 'info'); }
        };

        // ================================================================
        // APP
        // ================================================================
        var App = {
            charts: {},
            currentSort: { field: 'number', direction: 'asc' },
            notifPage: 0,
            notifLimit: 10,
            notifFilter: 'all',
            notifSearch: '',
            roomFilter: 'all',
            bookingFilter: 'all',
            paymentFilter: 'all',
            customerFilter: 'all',
            roomSearch: '',
            resizeObserver: null,
            sidebarOpen: false,

            init: function() {
                document.getElementById('resetPasswordBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Parolni default holatga (admin123) qaytarishni tasdiqlaysizmi?')) {
                        Auth.resetPassword();
                    }
                });
                document.getElementById('clearStorageBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Barcha lokal ma\'lumotlar tozalanadi. Davom etasizmi?')) {
                        Auth.clearStorage();
                    }
                });

                if (!Auth.check()) {
                    document.getElementById('loginPage').style.display = 'flex';
                    document.getElementById('app').style.display = 'none';
                    this.bindLoginEvents();
                    return;
                }
                var loginPage = document.getElementById('loginPage');
                if (loginPage) {
                    loginPage.classList.add('fade-out');
                    setTimeout(function() {
                        loginPage.style.display = 'none';
                        document.getElementById('app').style.display = 'flex';
                        App.initializeApp();
                    }, 500);
                } else {
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    this.initializeApp();
                }
            },

            initializeApp: function() {
                AppState.load();
                Theme.init();
                Lang.current = localStorage.getItem('hms_lang') || 'uz';
                Lang.apply();
                Toast.init();
                this.bindEvents();
                this.seedData();
                this.renderPage('dashboard');
                this.updateNotifications();
                setTimeout(function() { Toast.info('HMS ga xush kelibsiz'); }, 500);
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
                this.resizeObserver = new ResizeObserver(debounce(function() {
                    App.resizeCharts();
                }, 200));
                var mainContent = document.getElementById('mainContent');
                if (mainContent) {
                    this.resizeObserver.observe(mainContent);
                }
                window.addEventListener('orientationchange', function() {
                    setTimeout(function() { App.resizeCharts(); }, 400);
                });

                var toggleBtn = document.getElementById('sidebarToggle');
                if (toggleBtn) {
                    toggleBtn.classList.remove('open');
                    var icon = toggleBtn.querySelector('i');
                    if (icon) icon.className = 'fas fa-bars';
                }
            },

            resizeCharts: function() {
                Object.keys(this.charts).forEach(function(key) {
                    if (App.charts[key] && typeof App.charts[key].resize === 'function') {
                        App.charts[key].resize();
                    }
                });
            },

            bindLoginEvents: function() {
                document.getElementById('loginForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    var username = document.getElementById('loginUsername').value;
                    var password = document.getElementById('loginPassword').value;
                    var remember = document.getElementById('loginRemember').checked;
                    if (Auth.login(username, password, remember)) {
                        var loginPage = document.getElementById('loginPage');
                        if (loginPage) {
                            loginPage.classList.add('fade-out');
                            setTimeout(function() { window.location.reload(); }, 500);
                        } else {
                            window.location.reload();
                        }
                    } else {
                        Toast.error('Noto\'g\'ri foydalanuvchi nomi yoki parol');
                    }
                });
            },

            bindEvents: function() {
                document.getElementById('themeToggle').addEventListener('click', function() { Theme.toggle(); });

                document.getElementById('langSelect').addEventListener('change', function() { Lang.set(this.value); });

                document.querySelectorAll('.sidebar .nav-link[data-page]').forEach(function(link) {
                    link.addEventListener('click', function() {
                        var page = this.dataset.page;
                        App.renderPage(page);
                        if (window.innerWidth <= 992) {
                            App.closeSidebar();
                        }
                    });
                });

                document.querySelectorAll('.mob-nav-item').forEach(function(item) {
                    item.addEventListener('click', function() {
                        var page = this.dataset.page;
                        if (page) {
                            App.renderPage(page);
                        }
                    });
                    item.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            App.renderPage(this.dataset.page);
                        }
                    });
                });

                document.getElementById('sidebarCloseBtn').addEventListener('click', function() {
                    App.closeSidebar();
                });

                document.getElementById('sidebarToggle').addEventListener('click', function() {
                    App.toggleSidebar();
                });

                document.getElementById('sidebarOverlay').addEventListener('click', function() {
                    App.closeSidebar();
                });

                document.getElementById('notifBell').addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dropdown = document.getElementById('notifDropdown');
                    if (dropdown.classList.contains('open')) {
                        App.closeNotifDropdown();
                    } else {
                        dropdown.classList.add('open');
                        dropdown.classList.remove('closing');
                        App.notifPage = 0;
                        App.updateNotifications();
                    }
                });

                document.addEventListener('click', function(e) {
                    var dropdown = document.getElementById('notifDropdown');
                    var bell = document.getElementById('notifBell');
                    var isInside = dropdown && dropdown.contains(e.target);
                    var isBell = bell && bell.contains(e.target);
                    if (dropdown && dropdown.classList.contains('open') && !isInside && !isBell) {
                        App.closeNotifDropdown();
                    }
                });

                document.addEventListener('touchstart', function(e) {
                    var dropdown = document.getElementById('notifDropdown');
                    var bell = document.getElementById('notifBell');
                    var isInside = dropdown && dropdown.contains(e.target);
                    var isBell = bell && bell.contains(e.target);
                    if (dropdown && dropdown.classList.contains('open') && !isInside && !isBell) {
                        App.closeNotifDropdown();
                    }
                }, { passive: true });

                document.getElementById('notifMarkAllRead').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.markAllNotificationsRead();
                });
                document.getElementById('notifClearAll').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.clearAllNotifications();
                });

                document.querySelectorAll('#notifFilters .filter-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        document.querySelectorAll('#notifFilters .filter-btn').forEach(function(b) {
                            b.classList.remove('active');
                        });
                        this.classList.add('active');
                        App.notifFilter = this.dataset.filter;
                        App.notifPage = 0;
                        App.updateNotifications();
                    });
                });

                var searchInput = document.getElementById('notifSearch');
                if (searchInput) {
                    searchInput.addEventListener('input', debounce(function(e) {
                        e.stopPropagation();
                        App.notifSearch = this.value.toLowerCase();
                        App.notifPage = 0;
                        App.updateNotifications();
                    }, 250));
                }

                document.getElementById('loadMoreBtn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.notifPage++;
                    App.updateNotifications(true);
                });
            },

            toggleSidebar: function() {
                var sidebar = document.getElementById('sidebar');
                var overlay = document.getElementById('sidebarOverlay');
                var toggleBtn = document.getElementById('sidebarToggle');
                var isOpen = sidebar.classList.contains('open');

                if (isOpen) {
                    this.closeSidebar();
                } else {
                    sidebar.classList.add('open');
                    overlay.classList.add('active');
                    toggleBtn.classList.add('open');
                    var icon = toggleBtn.querySelector('i');
                    if (icon) {
                        icon.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        icon.style.transform = 'scale(0) rotate(90deg)';
                        icon.style.opacity = '0';
                        setTimeout(function() {
                            icon.className = 'fas fa-times';
                            icon.style.transform = 'scale(1) rotate(0)';
                            icon.style.opacity = '1';
                        }, 300);
                    }
                }
            },

            closeSidebar: function() {
                var sidebar = document.getElementById('sidebar');
                var overlay = document.getElementById('sidebarOverlay');
                var toggleBtn = document.getElementById('sidebarToggle');
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                toggleBtn.classList.remove('open');
                var icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    icon.style.transform = 'scale(0) rotate(-90deg)';
                    icon.style.opacity = '0';
                    setTimeout(function() {
                        icon.className = 'fas fa-bars';
                        icon.style.transform = 'scale(1) rotate(0)';
                        icon.style.opacity = '1';
                    }, 300);
                }
            },

            closeNotifDropdown: function() {
                var dropdown = document.getElementById('notifDropdown');
                if (!dropdown.classList.contains('open')) return;
                dropdown.classList.add('closing');
                setTimeout(function() {
                    dropdown.classList.remove('open', 'closing');
                }, 300);
            },

            renderPage: function(page) {
                AppState.set({ currentPage: page });

                document.querySelectorAll('.sidebar .nav-link').forEach(function(l) { l.classList.remove('active'); });
                document.querySelector('.sidebar .nav-link[data-page="' + page + '"]')?.classList.add('active');

                document.querySelectorAll('.page-section').forEach(function(p) { p.classList.remove('active-page'); });
                document.getElementById('page-' + page)?.classList.add('active-page');

                document.querySelectorAll('.mob-nav-item').forEach(function(item) {
                    item.classList.toggle('active', item.dataset.page === page);
                });

                var iconMap = {
                    dashboard: 'fa-chart-pie',
                    rooms: 'fa-door-open',
                    customers: 'fa-users',
                    bookings: 'fa-calendar-check',
                    payments: 'fa-credit-card',
                    reports: 'fa-file-alt',
                    profile: 'fa-user-cog',
                    settings: 'fa-sliders-h'
                };
                var titleEl = document.getElementById('pageTitle');
                if (titleEl) {
                    titleEl.classList.add('changing');
                    setTimeout(function() {
                        titleEl.innerHTML = '<i class="fas ' + (iconMap[page] || 'fa-home') + '"></i>';
                        titleEl.classList.remove('changing');
                    }, 150);
                }

                var renderMap = {
                    dashboard: function() { App.renderDashboard(); },
                    rooms: function() { App.renderRooms(); },
                    customers: function() { App.renderCustomers(); },
                    bookings: function() { App.renderBookings(); },
                    payments: function() { App.renderPayments(); },
                    reports: function() { App.renderReports(); },
                    profile: function() { App.renderProfile(); },
                    settings: function() { App.renderSettings(); }
                };
                if (renderMap[page]) renderMap[page]();
                this.updateNotifications();
            },

            // ===== DATA MANAGEMENT =====
            exportData: function() {
                var state = AppState.get();
                var history = JSON.parse(localStorage.getItem('hms_history') || '[]');
                var data = {
                    rooms: state.rooms,
                    customers: state.customers,
                    bookings: state.bookings,
                    payments: state.payments,
                    history: history,
                    settings: JSON.parse(localStorage.getItem('hms_settings') || '{}'),
                    currencyRates: getCurrencyRates(),
                    exportedAt: new Date().toISOString()
                };
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'hms_backup_' + new Date().toISOString().split('T')[0] + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                Toast.success('Ma\'lumotlar eksport qilindi');
            },

            importData: function(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var data = JSON.parse(e.target.result);
                        if (!data.rooms || !data.customers || !data.bookings || !data.payments) {
                            Toast.error('Noto\'g\'ri fayl formati');
                            return;
                        }
                        showConfirm('Barcha mavjud ma\'lumotlar o\'chiriladi va yangilari yuklanadi. Davom etasizmi?',
                            function() {
                                AppState.set({
                                    rooms: data.rooms || [],
                                    customers: data.customers || [],
                                    bookings: data.bookings || [],
                                    payments: data.payments || []
                                });
                                if (data.history) {
                                    localStorage.setItem('hms_history', JSON.stringify(data.history));
                                }
                                if (data.settings) {
                                    localStorage.setItem('hms_settings', JSON.stringify(data.settings));
                                }
                                if (data.currencyRates) {
                                    saveCurrencyRates(data.currencyRates);
                                    CURRENCY_RATES = getCurrencyRates();
                                }
                                AppState.save();
                                Toast.success('Ma\'lumotlar import qilindi');
                                App.renderPage(AppState.get().currentPage);
                            }, false);
                    } catch (err) {
                        Toast.error('Faylni o\'qib bo\'lmadi: ' + err.message);
                    }
                };
                reader.readAsText(file);
            },

            // ===== NOTIFICATIONS =====
            updateNotifications: function(append) {
                if (append === undefined) append = false;
                var notifs = AppState.get().notifications;
                var settings = JSON.parse(localStorage.getItem('hms_settings') || '{}');
                var notifSettings = settings.notifications || {};
                var allowedCategories = [];
                if (notifSettings.bookings !== false) allowedCategories.push('booking');
                if (notifSettings.payments !== false) allowedCategories.push('payment');
                if (notifSettings.customers !== false) allowedCategories.push('customer');
                allowedCategories.push('system');

                var unread = notifs.filter(function(n) {
                    return !n.read && allowedCategories.includes(n.category);
                });
                var badge = document.getElementById('notifBadge');
                var list = document.getElementById('notifList');
                var loadMore = document.getElementById('notifLoadMore');

                badge.style.display = unread.length > 0 ? 'flex' : 'none';
                if (unread.length > 0) badge.textContent = unread.length;

                var filtered = notifs.filter(function(n) { return allowedCategories.includes(n.category); });

                if (this.notifFilter === 'unread') filtered = filtered.filter(function(n) { return !n.read; });
                else if (this.notifFilter === 'booking') filtered = filtered.filter(function(n) { return n
                        .category === 'booking'; });
                else if (this.notifFilter === 'payment') filtered = filtered.filter(function(n) { return n
                        .category === 'payment'; });
                else if (this.notifFilter === 'customer') filtered = filtered.filter(function(n) { return n
                        .category === 'customer'; });
                else if (this.notifFilter === 'system') filtered = filtered.filter(function(n) { return n
                        .category === 'system'; });

                if (this.notifFilter !== 'all' && this.notifFilter !== 'unread' &&
                    !allowedCategories.includes(this.notifFilter)) {
                    this.notifFilter = 'all';
                    document.querySelectorAll('#notifFilters .filter-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.filter === 'all');
                    });
                }

                if (this.notifSearch) filtered = filtered.filter(function(n) { return n.message.toLowerCase().includes(
                        App.notifSearch); });

                var start = this.notifPage * this.notifLimit;
                var end = start + this.notifLimit;
                var pageItems = filtered.slice(start, end);

                document.querySelectorAll('#notifFilters .filter-btn').forEach(function(btn) {
                    var cat = btn.dataset.filter;
                    if (cat === 'all' || cat === 'unread' || allowedCategories.includes(cat)) {
                        btn.style.display = '';
                    } else {
                        btn.style.display = 'none';
                    }
                });

                if (append) {
                    pageItems.forEach(function(n) { list.appendChild(App.createNotifItem(n)); });
                } else {
                    list.innerHTML = '';
                    if (filtered.length === 0) {
                        list.innerHTML =
                            '<div class="notif-empty"><i class="fas fa-bell-slash"></i><div>' + Lang.t(
                                'no_notifications') + '</div></div>';
                    } else {
                        pageItems.forEach(function(n) { list.appendChild(App.createNotifItem(n)); });
                    }
                }
                loadMore.style.display = end < filtered.length ? 'block' : 'none';
                var loadMoreBtn = document.getElementById('loadMoreBtn');
                if (loadMoreBtn) loadMoreBtn.textContent = Lang.t('load_more');

                document.querySelectorAll('#notifFilters .filter-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.filter === App.notifFilter);
                });
            },

            createNotifItem: function(notif) {
                var div = document.createElement('div');
                div.className = 'notif-item' + (notif.read ? '' : ' unread');
                div.dataset.id = notif.id;

                var iconMap = {
                    booking: { icon: 'fa-calendar-check', cls: 'booking' },
                    payment: { icon: 'fa-credit-card', cls: 'payment' },
                    customer: { icon: 'fa-user', cls: 'customer' },
                    system: { icon: 'fa-cog', cls: 'system' },
                    error: { icon: 'fa-exclamation-circle', cls: 'error' }
                };
                var mapped = iconMap[notif.category] || { icon: 'fa-bell', cls: 'system' };

                div.innerHTML =
                    '<div class="notif-icon ' + mapped.cls + '">' +
                    '<i class="fas ' + mapped.icon + '"></i>' +
                    '</div>' +
                    '<div class="content">' +
                    '<div class="notif-message">' + escapeHtml(notif.message) + '</div>' +
                    '<div class="time"><i class="fas fa-clock"></i>' + getRelativeTime(notif.time) + '</div>' +
                    '</div>' +
                    '<div class="actions" style="display:flex;gap:4px;flex-shrink:0;">' +
                    (!notif.read ? '<button class="read-btn notif-action-btn" title="O\'qildi deb belgilash" data-id="' +
                        notif.id + '"><i class="fas fa-check"></i></button>' : '') +
                    '<button class="delete-btn notif-action-btn" title="O\'chirish" data-id="' + notif.id +
                    '" style="color:var(--color-danger);"><i class="fas fa-times"></i></button>' +
                    '</div>';

                div.querySelector('.read-btn')?.addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.markNotificationRead(this.dataset.id);
                });
                div.querySelector('.delete-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    App.deleteNotification(this.dataset.id);
                });

                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var id = this.dataset.id;
                    if (id) {
                        App.markNotificationRead(id);
                        App.closeNotifDropdown();
                    }
                });

                div.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                    var id = this.dataset.id;
                    if (id) {
                        App.markNotificationRead(id);
                        App.closeNotifDropdown();
                    }
                }, { passive: true });

                return div;
            },

            markNotificationRead: function(id) {
                var state = AppState.get();
                var notif = state.notifications.find(function(n) { return n.id === id; });
                if (notif) { notif.read = true;
                    AppState.set({ notifications: state.notifications });
                    this.updateNotifications(); }
            },

            markAllNotificationsRead: function() {
                var state = AppState.get();
                state.notifications.forEach(function(n) { n.read = true; });
                AppState.set({ notifications: state.notifications });
                this.updateNotifications();
                Toast.success('Barcha xabarlar o\'qildi');
            },

            deleteNotification: function(id) {
                var state = AppState.get();
                state.notifications = state.notifications.filter(function(n) { return n.id !== id; });
                AppState.set({ notifications: state.notifications });
                this.updateNotifications();
            },

            clearAllNotifications: function() {
                AppState.set({ notifications: [] });
                this.updateNotifications();
                Toast.success('Barcha xabarlar tozalandi');
            },

            addNotification: function(message, type, category) {
                if (type === undefined) type = 'info';
                if (category === undefined) category = 'system';
                try {
                    var settings = JSON.parse(localStorage.getItem('hms_settings') || '{}');
                    var notifSettings = settings.notifications || {};
                    if (category === 'booking' && notifSettings.bookings === false) return null;
                    if (category === 'payment' && notifSettings.payments === false) return null;
                    if (category === 'customer' && notifSettings.customers === false) return null;
                } catch (e) {}

                var notif = AppState.addNotification(message, type, category);
                this.updateNotifications();

                try {
                    var settings = JSON.parse(localStorage.getItem('hms_settings') || '{}');
                    if (settings.notifications?.browser &&
                        'Notification' in window &&
                        Notification.permission === 'granted') {
                        new Notification('HMS Xabari', { body: message });
                    }
                } catch (e) {}

                return notif;
            },

            // ===== DASHBOARD =====
            renderDashboard: function() {
                var state = AppState.get();
                var total = state.rooms.length;
                var available = state.rooms.filter(function(r) { return r.status === 'Available'; }).length;
                var booked = state.rooms.filter(function(r) { return r.status === 'Booked' || r.status === 'Occupied'; })
                    .length;

                var totalRevenue = state.payments.reduce(function(sum, p) { return sum + (p.status === 'Paid' ? p

            renderRooms: function() {
                var state = AppState.get();
                var search = this.roomSearch || '';
                var filtered = state.rooms;
                if (search) filtered = filtered.filter(function(r) { return r.number?.toLowerCase().includes(search) ||
                        r.type?.toLowerCase().includes(search); });

                if (this.roomFilter === 'available') filtered = filtered.filter(function(r) { return r.status ===
                        'Available'; });
                else if (this.roomFilter === 'booked') filtered = filtered.filter(function(r) { return r.status ===
                        'Booked' || r.status === 'Occupied'; });
                else if (this.roomFilter === 'vip') filtered = filtered.filter(function(r) { return r.type === 'VIP'; });
                else if (this.roomFilter === 'maintenance') filtered = filtered.filter(function(r) { return r.status ===
                        'Maintenance'; });

                var field = this.currentSort.field;
                var direction = this.currentSort.direction;
                filtered.sort(function(a, b) {
                    var valA = a[field] || '',
                        valB = b[field] || '';
                    if (field === 'number') { valA = parseInt(valA) || 0;
                        valB = parseInt(valB) || 0; }
                    if (typeof valA === 'string') { valA = valA.toLowerCase();
                        valB = valB.toLowerCase(); }
                    if (valA < valB) return direction === 'asc' ? -1 : 1;
                    if (valA > valB) return direction === 'asc' ? 1 : -1;
                    return 0;
                });

                var nextNumber = '101';
                if (state.rooms.length > 0) {
                    var nums = state.rooms.map(function(r) { return parseInt(r.number); }).filter(function(n) { return !isNaN(
                            n); }).sort(function(a, b) { return a - b; });
                    var found = null;
                    for (var i = 0; i < nums.length - 1; i++) {
                        if (nums[i + 1] - nums[i] > 1) { found = nums[i] + 1; break; }
                    }
                    nextNumber = String(found || nums[nums.length - 1] + 1);
                }

                        'save') + '</button>' +
                    '</div>' +

                    '</div>';

                    keyboard: true });
                modal.show();

                document.getElementById('saveBookingBtn').addEventListener('click', function() {
                    var id = document.getElementById('bookId').value;
                    var customerId = document.getElementById('bookCustomer').value;
                    var roomId = document.getElementById('bookRoom').value;
                    var checkin = document.getElementById('bookCheckin').value;
                    var checkout = document.getElementById('bookCheckout').value;
                    var status = document.getElementById('bookStatus').value;

                    if (!customerId || !roomId || !checkin || !checkout) { Toast.warning(Lang.t(
                        'required_field')); return; }
                    if (checkout <= checkin) { Toast.warning(
                            'Chiqish sanasi kirish sanasidan keyin bo\'lishi kerak'); return; }

                    var state = AppState.get();
                    var conflict = state.bookings.find(function(b) {
                        if (b.id === id) return false;
                        if (b.status === 'Cancelled' || b.status === 'Checked-out') return false;
                        if (b.roomId !== roomId) return false;
                        var newStart = new Date(checkin);
                        var newEnd = new Date(checkout);
                        var oldStart = new Date(b.checkin);
                        var oldEnd = new Date(b.checkout);
                        return (newStart < oldEnd && newEnd > oldStart);
                    });
                    if (conflict) { Toast.warning('Bu xona uchun sanalar to\'qnashuvi mavjud!'); return; }

                    var bookingData = { customerId: customerId, roomId: roomId, checkin: checkin,
                        checkout: checkout, status: status };
                    if (id) {
                        var idx = state.bookings.findIndex(function(b) { return b.id === id; });
                        if (idx > -1) {
                            var old = state.bookings[idx];
                            if (old.status === 'Checked-in' && status !== 'Checked-in') {
                                var room = state.rooms.find(function(r) { return r.id === old
                                        .roomId; });
                                if (room) room.status = 'Available';
                            }
                            state.bookings[idx] = { ...state.bookings[idx], ...bookingData };
                            if (status === 'Checked-in') {
                                var room = state.rooms.find(function(r) { return r.id ===
                                        roomId; });
                                if (room) room.status = 'Booked';
                            }
                            Toast.success(Lang.t('booking_updated'));
                            App.addNotification('Bron yangilandi', 'success', 'booking');
                        }
                    } else {
                        bookingData.id = AppState.genId();
                        bookingData.date = new Date().toISOString().split('T')[0];
                        state.bookings.push(bookingData);
                        if (status === 'Checked-in') {
                            var room = state.rooms.find(function(r) { return r.id === roomId; });
                            if (room) room.status = 'Booked';
                        }
                        Toast.success(Lang.t('booking_created'));
                        App.addNotification('Bron yaratildi', 'success', 'booking');
                    }
                    AppState.set(state);
                    modal.hide();
                    App.renderBookings();
                    App.renderDashboard();
                });

                document.getElementById('bookingModal').addEventListener('hidden.bs.modal', function() {
                    document.getElementById('bookingModal').remove();
                });
            },
