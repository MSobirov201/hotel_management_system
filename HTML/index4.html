    // ================================================================
    // SEED DATA - ENHANCED WITH MORE ROOMS, CUSTOMERS, BOOKINGS
    // ================================================================
    seedData() {
        const state = AppState.get();
        if (state.rooms.length > 0) return;
        
        // ===== 30+ ROOMS =====
        const rooms = [];
        const roomTypes = [
            { type: 'Standard', basePrice: 80 },
            { type: 'Standard', basePrice: 90 },
            { type: 'Deluxe', basePrice: 120 },
            { type: 'Deluxe', basePrice: 140 },
            { type: 'Suite', basePrice: 200 },
            { type: 'Suite', basePrice: 220 },
            { type: 'VIP', basePrice: 350 },
            { type: 'VIP', basePrice: 400 }
        ];
        const statuses = ['Available', 'Booked', 'Occupied', 'Maintenance'];
        let roomCounter = 101;
        for (let i = 0; i < 30; i++) {
            const typeIdx = i % roomTypes.length;
            const status = statuses[i % statuses.length];
            const price = roomTypes[typeIdx].basePrice + (i % 3) * 10;
            rooms.push({
                id: AppState.genId(),
                number: String(roomCounter + i),
                type: roomTypes[typeIdx].type,
                price: price,
                status: status
            });
        }
        for (let i = 0; i < 6; i++) {
            const idx = (i + 3) % roomTypes.length;
            rooms.push({
                id: AppState.genId(),
                number: String(201 + i),
                type: roomTypes[idx].type,
                price: roomTypes[idx].basePrice + 10,
                status: statuses[(i + 2) % statuses.length]
            });
        }

        // ===== 50+ CUSTOMERS =====
        const firstNames = ['John', 'Jane', 'Michael', 'Sarah', 'David', 'Emma', 'James', 'Olivia', 'Robert', 'Sophia', 'William', 'Isabella', 'Thomas', 'Mia', 'Charles', 'Charlotte', 'Daniel', 'Amelia', 'Matthew', 'Harper', 'Anthony', 'Evelyn', 'Donald', 'Abigail', 'Mark', 'Emily', 'Paul', 'Elizabeth', 'Steven', 'Sofia', 'Christopher', 'Ava', 'Andrew', 'Madison', 'Joshua', 'Anna', 'Alex', 'Victoria', 'Benjamin', 'Grace', 'Henry', 'Zoe', 'Jack', 'Lily', 'Oliver', 'Ella', 'Luke', 'Scarlett', 'Jay', 'Chloe'];
        const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis', 'Rodriguez', 'Martinez', 'Hernandez', 'Lopez', 'Wilson', 'Anderson', 'Thomas', 'Taylor', 'Moore', 'Jackson', 'Martin', 'Lee', 'Perez', 'Thompson', 'White', 'Harris', 'Sanchez', 'Clark', 'Ramirez', 'Lewis', 'Robinson', 'Walker', 'Young', 'Allen', 'King', 'Wright', 'Scott', 'Adams', 'Nelson', 'Baker', 'Mitchell', 'Cooper'];
        const nationalities = ['Uzbek', 'Russian', 'American', 'British', 'German', 'French', 'Italian', 'Spanish', 'Chinese', 'Japanese', 'Korean', 'Turkish', 'Kazakh', 'Ukrainian', 'Polish'];
        const genders = ['Male', 'Female'];
        
        const customers = [];
        for (let i = 0; i < 50; i++) {
            const firstName = firstNames[i % firstNames.length];
            const lastName = lastNames[i % lastNames.length];
            const phone = '+998' + String(900000000 + i * 111111).slice(0, 9);
            customers.push({
                id: AppState.genId(),
                name: `${firstName} ${lastName}`,
                email: `${firstName.toLowerCase()}.${lastName.toLowerCase()}@mail.com`,
                phone: phone,
                nationality: nationalities[i % nationalities.length],
                gender: genders[i % genders.length]
            });
        }

        // ===== 60+ BOOKINGS =====
        const today = new Date();
        const bookings = [];
        const statusList = ['Checked-in', 'Checked-out', 'Pending', 'Cancelled'];
        
        for (let i = 0; i < 60; i++) {
            const customer = customers[i % customers.length];
            const room = rooms[i % rooms.length];
            const checkinDate = new Date(today);
            checkinDate.setDate(checkinDate.getDate() - Math.floor(Math.random() * 60) + 10);
            const checkoutDate = new Date(checkinDate);
            checkoutDate.setDate(checkoutDate.getDate() + Math.floor(Math.random() * 7) + 1);
            
            const status = statusList[i % statusList.length];
            let finalStatus = status;
            if (status === 'Checked-in' && checkoutDate < today) finalStatus = 'Checked-out';
            if (status === 'Pending' && checkinDate < today) finalStatus = 'Checked-in';
            
            bookings.push({
                id: AppState.genId(),
                customerId: customer.id,
                roomId: room.id,
                checkin: checkinDate.toISOString().split('T')[0],
                checkout: checkoutDate.toISOString().split('T')[0],
                status: finalStatus,
                date: checkinDate.toISOString().split('T')[0]
            });
        }

        // ===== PAYMENTS =====
        const payments = [];
        const methods = ['Cash', 'Card', 'Online'];
        
        bookings.forEach((booking, index) => {
            const room = rooms.find(r => r.id === booking.roomId);
            if (!room) return;
            const days = Math.ceil((new Date(booking.checkout) - new Date(booking.checkin)) / (1000 * 60 * 60 * 24));
            const total = room.price * Math.max(1, days);
            
            const paidAmount = index % 5 === 0 ? total * 0.5 : total;
            const status = paidAmount >= total ? 'Paid' : 'Partial';
            
            payments.push({
                id: AppState.genId(),
                bookingId: booking.id,
                amount: paidAmount,
                method: methods[index % methods.length],
                status: status === 'Paid' ? 'Paid' : 'Pending',
                date: booking.checkin
            });
            
            if (index % 3 === 0 && status === 'Partial') {
                payments.push({
                    id: AppState.genId(),
                    bookingId: booking.id,
                    amount: total - paidAmount,
                    method: methods[(index + 1) % methods.length],
                    status: 'Pending',
                    date: booking.checkout
                });
            }
        });

        AppState.set({ rooms, customers, bookings, payments });
        AppState.addNotification('🏨 Mehmonxona ma\'lumotlari yuklandi!', 'success', 'system');
        AppState.addNotification(`✅ ${rooms.length} ta xona, ${customers.length} ta mijoz va ${bookings.length} ta bron yaratildi.`, 'info', 'system');
    }
};
