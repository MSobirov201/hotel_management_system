<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Hotel Management · Liquid Glass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --glass-shadow-hover: 0 16px 56px rgba(79, 70, 229, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --glass-blur: 32px;
            
            --bg-primary: #070B17;
            --bg-secondary: rgba(15, 23, 42, 0.7);
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --text-body: #E2E8F0;
            
            --accent-1: #6366F1;
            --accent-2: #8B5CF6;
            --accent-3: #3B82F6;
            --accent-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            --accent-glow: 0 0 60px rgba(99, 102, 241, 0.12);
            
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --color-danger: #EF4444;
            --color-info: #06B6D4;
            
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
            --card-shadow-hover: 0 16px 56px rgba(0, 0, 0, 0.3);
            
            --input-bg: rgba(255, 255, 255, 0.03);
            --input-border: rgba(255, 255, 255, 0.07);
            --input-focus: #6366F1;
            --input-text: #F1F5F9;
            
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;
            
            --font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
            --font-base: 0.95rem;
            --transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            --z-sidebar: 1000;
            --z-overlay: 999;
            --z-navbar: 100;
            --z-dropdown: 2000;
            --z-notification: 9999999;
            --z-modal: 999999;
            --z-toast: 99999;
            
            --btn-height: 48px;
            --input-height: 48px;
            --card-padding: 1.25rem;
        }

        [data-theme="light"] {
            --bg-primary: #F0F4FC;
            --bg-secondary: rgba(255, 255, 255, 0.3);
            --text-primary: #0A1628;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --text-body: #1E293B;
            
            --card-bg: rgba(255, 255, 255, 0.25);
            --card-border: rgba(255, 255, 255, 0.2);
            --card-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
            --card-shadow-hover: 0 16px 56px rgba(79, 70, 229, 0.08);
            
            --input-bg: rgba(255, 255, 255, 0.35);
            --input-border: rgba(0, 0, 0, 0.06);
            --input-text: #0A1628;
            
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
            
            --accent-1: #4F46E5;
            --accent-2: #7C3AED;
            --accent-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.5s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 20px; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            padding: var(--card-padding);
            color: var(--text-primary);
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: var(--card-shadow-hover);
        }
        .glass-card .stat-icon { 
            font-size: 2rem; 
            opacity: 0.85;
            transition: transform 0.3s ease;
        }
        .glass-card:hover .stat-icon { transform: scale(1.1); }
        .glass-card .stat-icon.green { color: var(--color-success); }
        .glass-card .stat-icon.yellow { color: var(--color-warning); }
        .glass-card .stat-icon.purple { color: var(--accent-2); }
        .glass-card .stat-icon.blue { color: var(--color-info); }
        .glass-card .stat-icon.red { color: var(--color-danger); }
        .glass-card .stat-icon.emerald { color: #34D399; }
        .glass-card .stat-value { 
            font-size: 1.8rem; 
            font-weight: 700; 
            margin: 0; 
            line-height: 1.2; 
            color: var(--text-primary);
            transition: color 0.3s ease;
        }
        .glass-card .stat-label { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 1.5rem;
            animation: loginFadeIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes loginFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes loginFadeOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.95) translateY(-20px); }
        }
        .login-page.fade-out {
            animation: loginFadeOut 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            padding: 3rem 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow-hover);
            color: var(--text-primary);
        }
        .login-card .logo h2 {
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #app { 
            display: flex; 
            min-height: 100vh; 
            animation: appFadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes appFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-content { flex: 1; padding: 1.5rem 2rem 3rem; min-height: 100vh; overflow-x: hidden; }

        .sidebar {
            width: 280px;
            min-height: calc(100vh - 2rem);
            margin: 1rem 0 1rem 1rem;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow-hover);
            padding: 1.5rem 0.5rem;
            position: sticky;
            top: 1rem;
            height: calc(100vh - 2rem);
            overflow-y: auto;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: var(--z-sidebar);
        }
        .sidebar .nav-link {
            color: var(--text-secondary);
            border-radius: var(--radius-full);
            margin: 0.1rem 0.5rem;
            padding: 0.7rem 1.2rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            position: relative;
            min-height: var(--btn-height);
            text-decoration: none;
            cursor: pointer;
        }
        .sidebar .nav-link:hover { 
            background: rgba(255,255,255,0.06); 
            color: var(--accent-1); 
            transform: translateX(4px);
        }
        .sidebar .nav-link.active { 
            background: rgba(255,255,255,0.08); 
            color: var(--accent-1);
            box-shadow: inset 0 0 20px rgba(99,102,241,0.05);
        }
        .sidebar .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 28px;
            background: var(--accent-gradient);
            border-radius: 0 4px 4px 0;
        }
        .sidebar .logo-area {
            padding: 0 0.5rem 1.5rem 0.5rem;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 1rem;
        }
        .sidebar .logo-area h4 {
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sidebar .brand-text {
            color: var(--text-muted);
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: var(--z-overlay);
            animation: fadeIn 0.3s ease;
        }
        .sidebar-overlay.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .page-section { display: none; animation: fadeSlide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .page-section.active-page { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .navbar-glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-full);
            padding: 0.4rem 1.4rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            z-index: var(--z-navbar);
            min-height: 64px;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            position: relative;
        }
        .navbar-glass .page-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .navbar-glass .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-full);
            padding: 0.5rem 1.4rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: var(--font-base);
            min-height: var(--btn-height);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1;
            touch-action: manipulation;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-glass:hover { 
            background: rgba(255, 255, 255, 0.08); 
            transform: scale(1.03); 
            color: var(--accent-1); 
            border-color: var(--accent-1);
        }
        .btn-glass:active { transform: scale(0.95); }
        .btn-glass-primary {
            background: var(--accent-gradient);
            color: white !important;
            border: none;
            box-shadow: 0 4px 24px rgba(99, 102, 241, 0.3);
        }
        .btn-glass-primary:hover { 
            color: white !important; 
            transform: scale(1.03); 
            box-shadow: 0 6px 32px rgba(99, 102, 241, 0.4);
            background: var(--accent-gradient);
        }
        .btn-glass-primary:active { transform: scale(0.95); }
        .btn-glass-sm { min-height: 36px; padding: 0.25rem 1rem; font-size: 0.85rem; }
        .btn-glass:disabled, .btn-glass-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-glass-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--color-danger);
            color: var(--color-danger);
        }
        .btn-glass-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--color-danger);
            color: #fff;
            transform: scale(1.03);
        }

        .form-control, .form-select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text) !important;
            border-radius: var(--radius-full);
            padding: 0.6rem 1.2rem;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: var(--font-base);
            min-height: var(--input-height);
            width: 100%;
            touch-action: manipulation;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .form-control::placeholder { color: var(--text-muted); opacity: 0.5; }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: var(--input-bg);
            color: var(--input-text) !important;
            transform: scale(1.01);
        }
        .form-label { color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; }

        /* ===== FILTER BUTTONS - FIXED ACTIVE STATE ===== */
        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--input-border);
            border-radius: var(--radius-full);
            padding: 0.4rem 1.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            position: relative;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            user-select: none;
        }
        .filter-btn:hover { 
            border-color: var(--accent-1); 
            color: var(--accent-1); 
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.08);
            background: rgba(99, 102, 241, 0.06);
        }
        /* ===== ACTIVE FILTER STATE - CLEAR AND DISTINCT ===== */
        .filter-btn.active {
            border-color: var(--accent-1);
            color: #FFFFFF !important;
            background: var(--accent-gradient);
            box-shadow: 0 4px 24px rgba(99, 102, 241, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
            transform: scale(1.04) translateY(-2px);
        }
        .filter-btn.active i {
            color: #FFFFFF !important;
        }
        .filter-btn.active::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-full);
            padding: 2px;
            background: var(--accent-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.4;
        }
        .filter-btn.active::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: var(--radius-full);
            background: var(--accent-gradient);
            opacity: 0.15;
            filter: blur(8px);
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .sort-btn {
            background: none;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-full);
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem 0.8rem;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: var(--btn-height);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: var(--font-base);
            touch-action: manipulation;
        }
        .sort-btn:hover { border-color: var(--accent-1); color: var(--accent-1); transform: scale(1.05); }
        .sort-btn.active { border-color: var(--accent-1); color: var(--accent-1); background: rgba(99, 102, 241, 0.06); }

        .badge-status {
            padding: 0.3rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            letter-spacing: 0.3px;
        }
        .badge-status.active { background: var(--color-success); color: white; }
        .badge-status.completed { background: #8B8E98; color: white; }
        .badge-status.pending { background: var(--color-warning); color: white; }
        .badge-status.cancelled { background: var(--color-danger); color: white; }
        .badge-status.available { background: var(--color-success); color: white; }
        .badge-status.booked { background: var(--color-warning); color: white; }
        .badge-status.occupied { background: var(--color-danger); color: white; }
        .badge-status.paid { background: var(--color-success); color: white; }
        .badge-status.unpaid { background: var(--color-danger); color: white; }
        .badge-status.partial { background: var(--color-warning); color: white; }

        .notif-bell {
            position: relative;
            cursor: pointer;
            z-index: var(--z-dropdown);
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
        }
        .notif-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--color-danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .notif-dropdown {
            position: fixed;
            top: 80px;
            right: 24px;
            width: 460px;
            max-width: calc(100vw - 48px);
            max-height: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(60px) saturate(200%);
            -webkit-backdrop-filter: blur(60px) saturate(200%);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: none;
            z-index: var(--z-notification);
            overflow: hidden;
            flex-direction: column;
            animation: notifSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top right;
            isolation: isolate;
        }
        @keyframes notifSlideIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .notif-dropdown.open { display: flex; }
        .notif-header {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 54px;
            flex-wrap: wrap;
            gap: 4px;
            background: rgba(0,0,0,0.15);
        }
        .notif-header .title { font-weight: 600; font-size: 0.95rem; color: var(--text-primary); }
        .notif-header .actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-full);
            transition: all 0.25s ease;
            min-height: 34px;
        }
        .notif-header .actions button:hover { background: rgba(255,255,255,0.04); color: var(--accent-1); transform: scale(1.05); }
        .notif-filters {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            background: rgba(0,0,0,0.05);
        }
        .notif-filters .filter-btn { 
            font-size: 0.75rem; 
            padding: 0.15rem 0.8rem; 
            min-height: 28px;
            cursor: pointer;
        }
        .notif-search {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
            background: rgba(0,0,0,0.03);
        }
        .notif-search input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-full);
            padding: 0.35rem 1rem;
            font-size: 0.85rem;

function formatCurrency(amount, currency = null) {
    const state = AppState ? AppState.get() : { currency: 'USD' };
    const curr = currency || state.currency || 'USD';
    const symbols = { USD: '$', EUR: '€', UZS: 'so\'m' };
    const symbol = symbols[curr] || '$';
    if (curr === 'UZS') {
        return `${new Intl.NumberFormat('uz-UZ').format(amount)} ${symbol}`;
    }
    return `${symbol}${amount}`;
}

function getRelativeTime(timestamp) {
    const now = Date.now();
    const diff = now - timestamp;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    if (seconds < 60) return 'Just now';
    if (minutes < 60) return `${minutes}m ago`;
    if (hours < 24) return `${hours}h ago`;
    if (days < 7) return `${days}d ago`;
    return new Date(timestamp).toLocaleDateString();
}

function getStatusKey(status) {
    const map = {
        'Available': 'available',
        'Booked': 'booked',
        'Occupied': 'occupied',
        'Maintenance': 'cancelled',
        'Checked-in': 'active',
        'Checked-out': 'completed',
        'Pending': 'pending',
        'Cancelled': 'cancelled',
        'Paid': 'paid',
        'Unpaid': 'unpaid',
        'Refunded': 'cancelled',
        'Partially Paid': 'partial'
    };
    return map[status] || 'pending';
}

function calculateBookingTotal(booking, state) {
    const room = state.rooms.find(r => r.id === booking.roomId);
    if (!room) return 0;
    const checkin = new Date(booking.checkin);
    const checkout = new Date(booking.checkout);
    const days = Math.max(1, Math.ceil((checkout - checkin) / (1000 * 60 * 60 * 24)));
    return room.price * days;
}

function getBookingPaymentStatus(booking, state) {
    const payments = state.payments.filter(p => p.bookingId === booking.id);
    const totalPaid = payments.reduce((sum, p) => sum + (p.status === 'Paid' ? p.amount : 0), 0);
    const totalPrice = calculateBookingTotal(booking, state);
    
    if (totalPaid === 0) return { status: 'Unpaid', paid: 0, remaining: totalPrice, total: totalPrice };
    if (totalPaid >= totalPrice) return { status: 'Paid', paid: totalPaid, remaining: 0, total: totalPrice };
    return { status: 'Partially Paid', paid: totalPaid, remaining: totalPrice - totalPaid, total: totalPrice };
}

const AppState = {
    data: { rooms: [], customers: [], bookings: [], payments: [], notifications: [], theme: 'dark', language: 'uz', currentPage: 'dashboard', currency: 'USD' },
    load() {
        try {
            const saved = localStorage.getItem('hms_state');
            if (saved) this.data = { ...this.data, ...JSON.parse(saved) };
            this.data.rooms = JSON.parse(localStorage.getItem('hms_rooms')) || [];
            this.data.customers = JSON.parse(localStorage.getItem('hms_customers')) || [];
            this.data.bookings = JSON.parse(localStorage.getItem('hms_bookings')) || [];
            this.data.payments = JSON.parse(localStorage.getItem('hms_payments')) || [];
            this.data.notifications = JSON.parse(localStorage.getItem('hms_notifications')) || [];
            const settings = JSON.parse(localStorage.getItem('hms_settings')) || {};
            this.data.currency = settings.currency || 'USD';
        } catch (e) { console.warn(e); }
    },
    save() {
        try {
            localStorage.setItem('hms_state', JSON.stringify({ theme: this.data.theme, language: this.data.language, currentPage: this.data.currentPage }));
            localStorage.setItem('hms_rooms', JSON.stringify(this.data.rooms));
            localStorage.setItem('hms_customers', JSON.stringify(this.data.customers));
            localStorage.setItem('hms_bookings', JSON.stringify(this.data.bookings));
            localStorage.setItem('hms_payments', JSON.stringify(this.data.payments));
            localStorage.setItem('hms_notifications', JSON.stringify(this.data.notifications));
        } catch (e) { console.warn(e); }
    },
    get() { return this.data; },
    set(newData) { this.data = { ...this.data, ...newData }; this.save(); },
    genId() { return Date.now() + Math.random().toString(36).substr(2, 6); },
    addNotification(message, type = 'info', category = 'system') {
        const notif = { id: this.genId(), message, type, category, time: Date.now(), read: false };
        this.data.notifications.unshift(notif);
        if (this.data.notifications.length > 200) this.data.notifications = this.data.notifications.slice(0, 200);
        this.save();
        return notif;
    }
};

const Lang = {
    current: 'uz',
    t(key) { return T[this.current]?.[key] || T.uz[key] || key; },
    apply() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = this.t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.placeholder = this.t(el.dataset.i18nPlaceholder);
        });
        const sel = document.getElementById('langSelect');
        if (sel) sel.value = this.current;
        this.updateNotificationFilterLabels();
        const searchInput = document.getElementById('notifSearch');
        if (searchInput) searchInput.placeholder = this.t('search_notifications');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        if (loadMoreBtn) loadMoreBtn.textContent = this.t('load_more');
        const notifTitle = document.querySelector('.notif-header .title span');
        if (notifTitle) notifTitle.textContent = this.t('notifications');
        const markAllBtn = document.querySelector('#notifMarkAllRead span');
        if (markAllBtn) markAllBtn.textContent = this.t('mark_all_read');
        const clearAllBtn = document.querySelector('#notifClearAll span');
        if (clearAllBtn) clearAllBtn.textContent = this.t('clear_all');
        const logoutBtn = document.getElementById('logoutSettingsBtn');
        if (logoutBtn) {
            const span = logoutBtn.querySelector('span');
            if (span) span.textContent = this.t('logout');
        }
    },
    updateNotificationFilterLabels() {
        const filters = document.querySelectorAll('#notifFilters .filter-btn');
        const filterMap = {
            'all': 'filter_all',
            'unread': 'filter_unread',
            'booking': 'filter_booking',
            'payment': 'filter_payment',
            'customer': 'filter_customer',
            'system': 'filter_system'
        };
        filters.forEach(btn => {
            const key = btn.dataset.filter;
            if (filterMap[key]) {
                const text = this.t(filterMap[key]);
                const icon = btn.querySelector('i');
                if (icon) {
                    btn.innerHTML = '';
                    btn.appendChild(icon);
                    btn.appendChild(document.createTextNode(' ' + text));
                } else {
                    btn.textContent = text;
                }
            }
        });
    },
    set(lang) { if (T[lang]) { this.current = lang; localStorage.setItem('hms_lang', lang); AppState.set({ language: lang }); this.apply(); App.renderPage(AppState.get().currentPage); } }
};

const Theme = {
    current: 'dark',
    apply(theme) {
        this.current = theme || this.current;
        document.documentElement.setAttribute('data-theme', this.current);
        localStorage.setItem('hms_theme', this.current);
        AppState.set({ theme: this.current });
        const icon = document.querySelector('#themeToggle i');
        if (icon) icon.className = this.current === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        const cb = document.getElementById('settingsDarkMode');
        if (cb) cb.checked = this.current === 'dark';
    },
    toggle() { this.apply(this.current === 'dark' ? 'light' : 'dark'); },
    init() { this.apply(localStorage.getItem('hms_theme') || 'dark'); }
};

const Toast = {
    container: null,
    init() { this.container = document.getElementById('toast-container'); },
    show(msg, type = 'info') {
        const div = document.createElement('div');
        const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
        div.className = `toast-msg ${type}`;
        div.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
        this.container.appendChild(div);
        setTimeout(() => { div.classList.add('fade-out'); setTimeout(() => div.remove(), 300); }, 4000);
    },
    success(m) { this.show(m, 'success'); },
    error(m) { this.show(m, 'error'); },
    warning(m) { this.show(m, 'warning'); },
    info(m) { this.show(m, 'info'); }
};

        AppState.load();

        Lang.apply();
        Toast.init();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('loginRemember').checked;
            if (Auth.login(username, password, remember)) {
                const loginPage = document.getElementById('loginPage');
                if (loginPage) {
                    loginPage.classList.add('fade-out');

                }

            }

    },

    bindEvents() {
        document.getElementById('themeToggle').addEventListener('click', () => Theme.toggle());
        document.getElementById('settingsDarkMode')?.addEventListener('change', function() { Theme.apply(this.checked ? 'dark' : 'light'); });
        document.getElementById('langSelect').addEventListener('change', function() { Lang.set(this.value); });

        document.querySelectorAll('.sidebar .nav-link[data-page]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                App.renderPage(page);

                document.getElementById('sidebarOverlay').classList.remove('active');
            });
        });

        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });

        document.getElementById('notifBell').addEventListener('click', function(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('notifDropdown');
            dropdown.classList.toggle('open');
            if (dropdown.classList.contains('open')) {
                App.notifPage = 0;
                App.updateNotifications();
            }
        });

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('notifDropdown');
            const bell = document.getElementById('notifBell');
            const isInside = dropdown && dropdown.contains(e.target);
            const isBell = bell && bell.contains(e.target);
            if (dropdown && !isInside && !isBell) {
                dropdown.classList.remove('open');
            }
        });

        document.addEventListener('touchstart', function(e) {
            const dropdown = document.getElementById('notifDropdown');
            const bell = document.getElementById('notifBell');
            const isInside = dropdown && dropdown.contains(e.target);
            const isBell = bell && bell.contains(e.target);
            if (dropdown && !isInside && !isBell) {
                dropdown.classList.remove('open');
            }

        const pageNames = { dashboard: 'Boshqaruv', rooms: 'Xonalar', customers: 'Mijozlar', bookings: 'Bronlar', payments: 'To\'lovlar', reports: 'Hisobotlar', profile: 'Profil', settings: 'Sozlamalar' };
        document.getElementById('pageTitle').innerHTML = `<i class="fas ${icons[page] || 'fa-chart-line'} me-2"></i>${pageNames[page] || page}`;

        const renderMap = {
            dashboard: () => this.renderDashboard(),
            rooms: () => this.renderRooms(),
            customers: () => this.renderCustomers(),
            bookings: () => this.renderBookings(),
            payments: () => this.renderPayments(),
            reports: () => this.renderReports(),
            profile: () => this.renderProfile(),
            settings: () => this.renderSettings()
        };
        if (renderMap[page]) renderMap[page]();
        this.updateNotifications();
    },

    updateNotifications(append = false) {
        const notifs = AppState.get().notifications;
        const unread = notifs.filter(n => !n.read);
        const badge = document.getElementById('notifBadge');
        const list = document.getElementById('notifList');
        const loadMore = document.getElementById('notifLoadMore');

        badge.style.display = unread.length > 0 ? 'flex' : 'none';
        if (unread.length > 0) badge.textContent = unread.length;

        let filtered = notifs;
        if (this.notifFilter === 'unread') filtered = filtered.filter(n => !n.read);
        else if (this.notifFilter === 'booking') filtered = filtered.filter(n => n.category === 'booking');
        else if (this.notifFilter === 'payment') filtered = filtered.filter(n => n.category === 'payment');
        else if (this.notifFilter === 'customer') filtered = filtered.filter(n => n.category === 'customer');
        else if (this.notifFilter === 'system') filtered = filtered.filter(n => n.category === 'system');

        if (this.notifSearch) filtered = filtered.filter(n => n.message.toLowerCase().includes(this.notifSearch));

        const start = this.notifPage * this.notifLimit;
        const end = start + this.notifLimit;
        const pageItems = filtered.slice(start, end);

        if (append) {
            pageItems.forEach(n => list.appendChild(this.createNotifItem(n)));
        } else {
            list.innerHTML = '';
            if (filtered.length === 0) {
                list.innerHTML = `<div class="notif-empty"><i class="fas fa-bell-slash"></i><div>${Lang.t('no_notifications')}</div></div>`;
            } else {
                pageItems.forEach(n => list.appendChild(this.createNotifItem(n)));
            }
        }
        loadMore.style.display = end < filtered.length ? 'block' : 'none';
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        if (loadMoreBtn) loadMoreBtn.textContent = Lang.t('load_more');
    },

    createNotifItem(notif) {
        const div = document.createElement('div');
        div.className = `notif-item ${notif.read ? '' : 'unread'}`;
        div.dataset.id = notif.id;
        const iconMap = { booking: 'fa-calendar-check', payment: 'fa-credit-card', customer: 'fa-user', system: 'fa-cog' };
        const icon = iconMap[notif.category] || 'fa-bell';
        div.innerHTML = `
            <i class="fas ${icon}" style="color:var(--text-muted);opacity:0.4;margin-top:4px;"></i>
            <div class="content"><div>${notif.message}</div><div class="time">${getRelativeTime(notif.time)}</div></div>
            <div class="actions">
                ${!notif.read ? `<button class="read-btn" data-id="${notif.id}"><i class="fas fa-check"></i></button>` : ''}
                <button class="delete-btn" data-id="${notif.id}"><i class="fas fa-times"></i></button>
            </div>
        `;
        div.querySelector('.read-btn')?.addEventListener('click', function(e) { e.stopPropagation(); App.markNotificationRead(this.dataset.id); });
        div.querySelector('.delete-btn').addEventListener('click', function(e) { e.stopPropagation(); App.deleteNotification(this.dataset.id); });
        
        div.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            if (id) {
                App.markNotificationRead(id);
                const dropdown = document.getElementById('notifDropdown');
                if (dropdown) dropdown.classList.remove('open');
            }
        });
        
        div.addEventListener('touchstart', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            if (id) {
                App.markNotificationRead(id);
                const dropdown = document.getElementById('notifDropdown');
                if (dropdown) dropdown.classList.remove('open');
            }
        }, { passive: true });
        
        return div;
    },

    markNotificationRead(id) {
        const state = AppState.get();
        const notif = state.notifications.find(n => n.id === id);
        if (notif) { notif.read = true; AppState.set({ notifications: state.notifications }); this.updateNotifications(); }
    },

    markAllNotificationsRead() {
        const state = AppState.get();
        state.notifications.forEach(n => n.read = true);
        AppState.set({ notifications: state.notifications });
        this.updateNotifications();
        Toast.success('Barcha xabarlar o\'qildi');
    },

    deleteNotification(id) {
        const state = AppState.get();
        state.notifications = state.notifications.filter(n => n.id !== id);
        AppState.set({ notifications: state.notifications });
        this.updateNotifications();
    },

    clearAllNotifications() {
        AppState.set({ notifications: [] });
        this.updateNotifications();
        Toast.success('Barcha xabarlar tozalandi');
    },

    addNotification(message, type = 'info', category = 'system') {
        const notif = AppState.addNotification(message, type, category);
        this.updateNotifications();
        const settings = JSON.parse(localStorage.getItem('hms_settings')) || {};
        if (settings.notifications?.browser && 'Notification' in window && Notification.permission === 'granted') {
            new Notification('HMS Xabari', { body: message, icon: '🏨' });
        }
        return notif;
    },

    renderRooms() {
        const state = AppState.get();
        const search = document.getElementById('roomSearch')?.value?.toLowerCase() || '';
        let filtered = state.rooms;
        if (search) filtered = filtered.filter(r => r.number?.toLowerCase().includes(search) || r.type?.toLowerCase().includes(search));

        const roomFilter = document.querySelector('.room-filter-btn.active')?.dataset.filter || 'all';
        if (roomFilter === 'available') filtered = filtered.filter(r => r.status === 'Available');
        else if (roomFilter === 'booked') filtered = filtered.filter(r => r.status === 'Booked' || r.status === 'Occupied');
        else if (roomFilter === 'vip') filtered = filtered.filter(r => r.type === 'VIP');
        else if (roomFilter === 'maintenance') filtered = filtered.filter(r => r.status === 'Maintenance');

        const { field, direction } = this.currentSort;
        filtered.sort((a, b) => {
            let valA = a[field] || '', valB = b[field] || '';
            if (field === 'number') { valA = parseInt(valA) || 0; valB = parseInt(valB) || 0; }
            if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
            if (valA < valB) return direction === 'asc' ? -1 : 1;
            if (valA > valB) return direction === 'asc' ? 1 : -1;
            return 0;
        });

        document.getElementById('page-rooms').innerHTML = `
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <h2 class="fw-light mb-0"><i class="fas fa-door-open me-2"></i>${Lang.t('nav_rooms')}</h2>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <button class="btn-glass btn-glass-primary" id="addRoomBtn"><i class="fas fa-plus"></i> ${Lang.t('add_room')}</button>
                    <div class="d-flex gap-1 align-items-center flex-wrap">
                        <input id="roomSearch" class="form-control" placeholder="${Lang.t('search')}" style="width:160px;min-width:120px;">
                        <button class="sort-btn" data-sort="number"><i class="fas fa-sort-numeric-down"></i></button>
                        <button class="sort-btn" data-sort="type"><i class="fas fa-sort-alpha-down"></i></button>

                </div>
            </div>

                <button class="filter-btn room-filter-btn active" data-filter="all"><i class="fas fa-list"></i> ${Lang.t('all')}</button>
                <button class="filter-btn room-filter-btn" data-filter="available"><i class="fas fa-check-circle" style="color:var(--color-success);"></i> ${Lang.t('available')}</button>
                <button class="filter-btn room-filter-btn" data-filter="booked"><i class="fas fa-bookmark" style="color:var(--color-warning);"></i> ${Lang.t('booked')}</button>
                <button class="filter-btn room-filter-btn" data-filter="vip"><i class="fas fa-crown" style="color:var(--color-warning);"></i> VIP</button>
                <button class="filter-btn room-filter-btn" data-filter="maintenance"><i class="fas fa-tools" style="color:var(--color-danger);"></i> ${Lang.t('maintenance')}</button>
            </div>
            <div id="roomCards" class="row g-3"></div>
        `;

        document.querySelectorAll('.room-filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.room-filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                App.renderRooms();
            });
        });

        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const field = this.dataset.sort;
                if (App.currentSort.field === field) App.currentSort.direction = App.currentSort.direction === 'asc' ? 'desc' : 'asc';
                else { App.currentSort.field = field; App.currentSort.direction = 'asc'; }
                App.renderRooms();
            });
        });

        document.getElementById('roomSearch')?.addEventListener('input', () => this.renderRooms());
        document.getElementById('addRoomBtn')?.addEventListener('click', () => this.openRoomModal());

        const cards = document.getElementById('roomCards');
        const currency = AppState.get().currency || 'USD';
        const symbols = { USD: '$', EUR: '€', UZS: 'so\'m' };
        const symbol = symbols[currency] || '$';

        if (filtered.length === 0 && state.rooms.length === 0) {
            cards.innerHTML = `
                <div class="col-12">
                    <div class="glass-card text-center p-5">
                        <div class="empty-state">
                            <div class="icon"><i class="fas fa-door-open"></i></div>
                            <h5>${Lang.t('empty_rooms')}</h5>
                            <p>${Lang.t('empty_rooms_desc')}</p>
                            <button class="btn-glass btn-glass-primary" id="addRoomBtnEmpty"><i class="fas fa-plus"></i> ${Lang.t('add_room')}</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('addRoomBtnEmpty')?.addEventListener('click', () => this.openRoomModal());
        } else if (filtered.length === 0 && state.rooms.length > 0) {
            cards.innerHTML = `
                <div class="col-12">
                    <div class="glass-card text-center p-5">
                        <div class="empty-state">
                            <div class="icon"><i class="fas fa-search"></i></div>
                            <h5>${Lang.t('no_data')}</h5>
                            <p class="text-muted">${Lang.t('no_recent_activity')}</p>
                            <button class="btn-glass" onclick="document.querySelector('.room-filter-btn.active')?.click(); document.getElementById('roomSearch').value=''; App.renderRooms();">

                    </div>

            cards.innerHTML = filtered.map(r => `

                    <div class="glass-card room-card">
                        <div class="d-flex justify-content-between align-items-start">

                        <p class="mb-2 text-muted">${r.type} · ${symbol}${r.price}</p>
                        <div class="d-flex gap-1 flex-wrap">
                            <button class="btn-glass btn-glass-sm editRoom" data-id="${r.id}"><i class="fas fa-edit"></i> ${Lang.t('edit')}</button>

                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.editRoom').forEach(btn => btn.addEventListener('click', () => this.openRoomModal(btn.dataset.id)));
        document.querySelectorAll('.deleteRoom').forEach(btn => btn.addEventListener('click', () => this.deleteRoom(btn.dataset.id)));
    },

    openRoomModal(id = null) {
        const state = AppState.get();
        const room = id ? state.rooms.find(r => r.id === id) : null;
        const oldModal = document.getElementById('roomModal');
        if (oldModal) oldModal.remove();

        const modalHtml = `
            <div class="modal fade" id="roomModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content glass">
                        <div class="modal-header">
                            <h5 class="modal-title">${room ? 'Xonani tahrirlash' : 'Xona qo\'shish'}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form id="roomForm" novalidate>
                                <input type="hidden" id="roomId" value="${room?.id || ''}">
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('number')}</label>
                                    <input id="roomNumber" class="form-control" value="${room?.number || ''}" placeholder="${Lang.t('enter_room_number')}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('type')}</label>
                                    <select id="roomType" class="form-select">
                                        <option value="Standard" ${room?.type === 'Standard' ? 'selected' : ''}>Standard</option>
                                        <option value="Deluxe" ${room?.type === 'Deluxe' ? 'selected' : ''}>Deluxe</option>
                                        <option value="Luxury" ${room?.type === 'Luxury' ? 'selected' : ''}>Luxury</option>
                                        <option value="VIP" ${room?.type === 'VIP' ? 'selected' : ''}>VIP</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('price')}</label>
                                    <input id="roomPrice" type="number" class="form-control" value="${room?.price || ''}" placeholder="${Lang.t('enter_price')}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('status')}</label>
                                    <select id="roomStatus" class="form-select">
                                        <option value="Available" ${room?.status === 'Available' ? 'selected' : ''}>${Lang.t('available')}</option>
                                        <option value="Booked" ${room?.status === 'Booked' ? 'selected' : ''}>${Lang.t('booked')}</option>
                                        <option value="Occupied" ${room?.status === 'Occupied' ? 'selected' : ''}>Occupied</option>
                                        <option value="Maintenance" ${room?.status === 'Maintenance' ? 'selected' : ''}>${Lang.t('maintenance')}</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-glass" data-bs-dismiss="modal">${Lang.t('cancel')}</button>
                            <button class="btn-glass btn-glass-primary" id="saveRoomBtn">${Lang.t('save')}</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('modal-container').insertAdjacentHTML('beforeend', modalHtml);
        const modal = new bootstrap.Modal(document.getElementById('roomModal'), { backdrop: 'static', keyboard: true });
        modal.show();

        document.getElementById('saveRoomBtn').addEventListener('click', () => {
            const id = document.getElementById('roomId').value;
            const number = document.getElementById('roomNumber').value.trim();
            const type = document.getElementById('roomType').value;
            const price = parseFloat(document.getElementById('roomPrice').value);
            const status = document.getElementById('roomStatus').value;

            if (!number || !price) { Toast.warning(Lang.t('required_field')); return; }
            const state = AppState.get();
            const existingRoom = state.rooms.find(r => r.number === number && r.id !== id);
            if (existingRoom) { Toast.warning(Lang.t('duplicate_room')); return; }

            const roomData = { number, type, price, status };
            if (id) {
                const idx = state.rooms.findIndex(r => r.id === id);
                if (idx > -1) { state.rooms[idx] = { ...state.rooms[idx], ...roomData }; Toast.success(Lang.t('room_updated')); this.addNotification(`Xona #${number} yangilandi`, 'success', 'system'); }
            } else {
                roomData.id = AppState.genId();
                state.rooms.push(roomData);
                Toast.success(Lang.t('room_added'));
                this.addNotification(`Xona #${number} qo\'shildi`, 'success', 'system');
            }
            AppState.set(state);
            modal.hide();
            this.renderRooms();
            this.renderDashboard();
        });

        document.getElementById('roomModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('roomModal').remove();
        });
    },

    deleteRoom(id) {
        if (!confirm('Bu xonani o\'chirmoqchimisiz?')) return;
        const state = AppState.get();
        const room = state.rooms.find(r => r.id === id);
        state.rooms = state.rooms.filter(r => r.id !== id);
        AppState.set(state);
        Toast.success(Lang.t('room_deleted'));
        this.addNotification(`Xona #${room?.number} o\'chirildi`, 'info', 'system');
        this.renderRooms();
        this.renderDashboard();
    },

    renderCustomers() {

        document.getElementById('saveBookingBtn').addEventListener('click', () => {
            const id = document.getElementById('bookId').value;
            const customerId = document.getElementById('bookCustomer').value;
            const roomId = document.getElementById('bookRoom').value;
            const checkin = document.getElementById('bookCheckin').value;
            const checkout = document.getElementById('bookCheckout').value;
            const status = document.getElementById('bookStatus').value;

            if (!customerId || !roomId || !checkin || !checkout) { Toast.warning(Lang.t('required_field')); return; }
            if (checkout <= checkin) { Toast.warning('Chiqish sanasi kirish sanasidan keyin bo\'lishi kerak'); return; }

            const state = AppState.get();
            const existingBooking = state.bookings.find(b => b.roomId === roomId && (b.status === 'Checked-in' || b.status === 'Pending') && b.id !== id);
            if (existingBooking) { Toast.warning(Lang.t('room_booked')); return; }

            const bookingData = { customerId, roomId, checkin, checkout, status };
            if (id) {
                const idx = state.bookings.findIndex(b => b.id === id);
                if (idx > -1) {
                    const old = state.bookings[idx];
                    if (old.status === 'Checked-in' && status !== 'Checked-in') {
                        const room = state.rooms.find(r => r.id === old.roomId);
                        if (room) room.status = 'Available';

                    state.bookings[idx] = { ...state.bookings[idx], ...bookingData };

                if (status === 'Checked-in') {

            this.renderBookings();
            this.renderDashboard();
        });

        document.getElementById('bookingModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('bookingModal').remove();
        });

        this.addNotification('Bron o\'chirildi', 'info', 'booking');
        this.renderBookings();
        this.renderDashboard();

        document.querySelectorAll('.payOutstanding').forEach(btn => {

        document.querySelectorAll('.payment-filter-btn').forEach(btn => {

                document.querySelectorAll('.payment-filter-btn').forEach(b => b.classList.remove('active'));

            });

                    maintainAspectRatio: false,

                            }

                    scales: {

                            grid: { color: 'rgba(255,255,255,0.05)' },

                            }

    openPaymentModal(id = null, preSelectedBooking = null, preSelectedAmount = null) {
        const state = AppState.get();
        const payment = id ? state.payments.find(p => p.id === id) : null;
        let activeBookings = state.bookings.filter(b => b.status === 'Checked-in' || b.status === 'Pending');
        
        if (preSelectedBooking) {
            const booking = state.bookings.find(b => b.id === preSelectedBooking);
            if (booking && !activeBookings.find(b => b.id === preSelectedBooking)) {
                activeBookings.push(booking);
            }
        }
        
        const oldModal = document.getElementById('paymentModal');
        if (oldModal) oldModal.remove();

        let selectedBooking = null;
        let paymentStatus = null;
        if (preSelectedBooking) {
            selectedBooking = state.bookings.find(b => b.id === preSelectedBooking);
            if (selectedBooking) {
                paymentStatus = getBookingPaymentStatus(selectedBooking, state);
            }
        }

        const modalHtml = `
            <div class="modal fade" id="paymentModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content glass">
                        <div class="modal-header">
                            <h5 class="modal-title">${payment ? 'To\'lovni tahrirlash' : 'To\'lov qo\'shish'}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            ${selectedBooking && paymentStatus ? `
                                <div class="payment-summary">
                                    <div class="row g-2">
                                        <div class="col-md-6"><div class="label">${Lang.t('customer')}</div><div class="value">${state.customers.find(c => c.id === selectedBooking.customerId)?.name || 'N/A'}</div></div>
                                        <div class="col-md-6"><div class="label">${Lang.t('room')}</div><div class="value">#${state.rooms.find(r => r.id === selectedBooking.roomId)?.number || 'N/A'} (${state.rooms.find(r => r.id === selectedBooking.roomId)?.type || 'N/A'})</div></div>
                                        <div class="col-md-4"><div class="label">${Lang.t('checkin')}</div><div class="value">${selectedBooking.checkin}</div></div>
                                        <div class="col-md-4"><div class="label">${Lang.t('checkout')}</div><div class="value">${selectedBooking.checkout}</div></div>
                                        <div class="col-md-4"><div class="label">${Lang.t('days')}</div><div class="value">${Math.ceil((new Date(selectedBooking.checkout) - new Date(selectedBooking.checkin)) / (1000 * 60 * 60 * 24))}</div></div>
                                        <div class="col-md-4"><div class="label">${Lang.t('daily_price')}</div><div class="value">${formatCurrency(state.rooms.find(r => r.id === selectedBooking.roomId)?.price || 0)}</div></div>
                                        <div class="col-md-4"><div class="label">${Lang.t('total_price')}</div><div class="value highlight">${formatCurrency(paymentStatus.total)}</div></div>
                                        <div class="col-md-4"><div class="label">${Lang.t('status')}</div>
                                            <span class="badge-status ${paymentStatus.status === 'Paid' ? 'paid' : paymentStatus.status === 'Partially Paid' ? 'partial' : 'pending'}">
                                                ${paymentStatus.status === 'Paid' ? Lang.t('paid_payments') : paymentStatus.status === 'Partially Paid' ? Lang.t('partially_paid') : Lang.t('unpaid')}
                                            </span>
                                        </div>
                                        <div class="col-md-6"><div class="label">${Lang.t('paid_amount')}</div><div class="value success">${formatCurrency(paymentStatus.paid)}</div></div>
                                        <div class="col-md-6"><div class="label">${Lang.t('remaining_amount')}</div><div class="value ${paymentStatus.remaining > 0 ? 'danger' : 'success'}">${formatCurrency(paymentStatus.remaining)}</div></div>
                                    </div>
                                </div>
                            ` : ''}
                            <form id="paymentForm" novalidate>
                                <input type="hidden" id="payId" value="${payment?.id || ''}">
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('booking')}</label>
                                    <select id="payBooking" class="form-select" required>
                                        <option value="">${Lang.t('select_booking')}</option>
                                        ${activeBookings.map(b => {
                                            const ps = getBookingPaymentStatus(b, state);
                                            const r = state.rooms.find(room => room.id === b.roomId);
                                            const c = state.customers.find(cust => cust.id === b.customerId);
                                            const isPaid = ps.status === 'Paid';
                                            return `<option value="${b.id}" ${(payment?.bookingId === b.id || preSelectedBooking === b.id) ? 'selected' : ''} ${isPaid ? 'disabled' : ''}>
                                                #${r?.number || 'N/A'} - ${c?.name || 'N/A'} (${ps.status}${isPaid ? ' ✅' : ''})
                                            </option>`;
                                        }).join('')}
                                        ${activeBookings.length === 0 ? '<option value="" disabled>Bronlar mavjud emas</option>' : ''}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">${Lang.t('amount')}</label>
                                    <input id="payAmount" type="number" class="form-control" value="${preSelectedAmount || payment?.amount || ''}" placeholder="${Lang.t('enter_amount')}" required>

                                    <label class="form-label">${Lang.t('method')}</label>
                                    <select id="payMethod" class="form-select">
                                        <option value="Cash" ${payment?.method === 'Cash' ? 'selected' : ''}>Naqd</option>
                                        <option value="Card" ${payment?.method === 'Card' ? 'selected' : ''}>Karta</option>
                                        <option value="Online" ${payment?.method === 'Online' ? 'selected' : ''}>Online</option>

                                    <label class="form-label">${Lang.t('status')}</label>
                                    <select id="payStatus" class="form-select">
                                        <option value="Paid" ${payment?.status === 'Paid' ? 'selected' : ''}>To\'langan</option>
                                        <option value="Pending" ${payment?.status === 'Pending' ? 'selected' : ''}>Kutilmoqda</option>
                                        <option value="Refunded" ${payment?.status === 'Refunded' ? 'selected' : ''}>Qaytarilgan</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-glass" data-bs-dismiss="modal">${Lang.t('cancel')}</button>
                            <button class="btn-glass btn-glass-primary" id="savePaymentBtn">${Lang.t('save')}</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('modal-container').insertAdjacentHTML('beforeend', modalHtml);
        const modal = new bootstrap.Modal(document.getElementById('paymentModal'), { backdrop: 'static', keyboard: true });
        modal.show();

        document.getElementById('payBooking').addEventListener('change', function() {
            const bookingId = this.value;
            if (bookingId) {
                const booking = state.bookings.find(b => b.id === bookingId);
                if (booking && !document.getElementById('payId').value) {
                    const ps = getBookingPaymentStatus(booking, state);
                    if (ps.status === 'Paid') {
                        document.getElementById('payAmount').value = 0;
                        document.getElementById('payAmountHelp').textContent = Lang.t('booking_already_paid');
                        document.getElementById('payAmount').disabled = true;
                    } else {
                        document.getElementById('payAmount').value = ps.remaining || ps.total;
                        document.getElementById('payAmountHelp').textContent = `Qolgan miqdor: ${formatCurrency(ps.remaining)} | Jami: ${formatCurrency(ps.total)}`;
                        document.getElementById('payAmount').disabled = false;
                    }
                }
            }
        });

        document.getElementById('savePaymentBtn').addEventListener('click', () => {
            const id = document.getElementById('payId').value;
            const bookingId = document.getElementById('payBooking').value;
            const amount = parseFloat(document.getElementById('payAmount').value);
            const method = document.getElementById('payMethod').value;
            const status = document.getElementById('payStatus').value;

            if (!bookingId || !amount || amount <= 0) { Toast.warning(Lang.t('required_field')); return; }

            const state = AppState.get();
            const booking = state.bookings.find(b => b.id === bookingId);
            if (!booking) { Toast.error('Bron topilmadi'); return; }

            const paymentStatus = getBookingPaymentStatus(booking, state);
            
            if (paymentStatus.status === 'Paid') {
                Toast.error(Lang.t('booking_already_paid'));
                return;
            }

            if (amount > paymentStatus.remaining) {
                Toast.error(Lang.t('payment_exceeds_total'));
                return;
            }

            const paymentData = { bookingId, amount, method, status, date: new Date().toISOString().split('T')[0] };
            if (id) {
                const idx = state.payments.findIndex(p => p.id === id);
                if (idx > -1) { state.payments[idx] = { ...state.payments[idx], ...paymentData }; Toast.success(Lang.t('payment_updated')); this.addNotification('To\'lov yangilandi', 'success', 'payment'); }
            } else {
                paymentData.id = AppState.genId();
                state.payments.push(paymentData);
                Toast.success(Lang.t('payment_added'));
                this.addNotification(`To\'lov qo\'shildi (${formatCurrency(amount)})`, 'success', 'payment');
            }
            AppState.set(state);
            modal.hide();
            this.renderPayments();
            this.renderDashboard();
        });

        document.getElementById('paymentModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('paymentModal').remove();
        });
    },

    deletePayment(id) {
        if (!confirm('Bu to\'lovni o\'chirmoqchimisiz?')) return;
        const state = AppState.get();
        state.payments = state.payments.filter(p => p.id !== id);
        AppState.set(state);
        Toast.success(Lang.t('payment_deleted'));
        this.addNotification('To\'lov o\'chirildi', 'info', 'payment');
        this.renderPayments();
        this.renderDashboard();
    },

    renderReports() {
        const state = AppState.get();
        const reportFilter = document.querySelector('.report-filter-btn.active')?.dataset.filter || 'today';
        let filteredPayments = state.payments;
        if (reportFilter === 'today') filteredPayments = filteredPayments.filter(p => p.date === new Date().toISOString().split('T')[0]);
        else if (reportFilter === 'week') {
            const weekStart = new Date();
            weekStart.setDate(weekStart.getDate() - 7);
            filteredPayments = filteredPayments.filter(p => new Date(p.date) >= weekStart);
        } else if (reportFilter === 'month') {
            const monthStart = new Date();
            monthStart.setMonth(monthStart.getMonth() - 1);
            filteredPayments = filteredPayments.filter(p => new Date(p.date) >= monthStart);
        } else if (reportFilter === 'year') {
            const yearStart = new Date();
            yearStart.setFullYear(yearStart.getFullYear() - 1);
            filteredPayments = filteredPayments.filter(p => new Date(p.date) >= yearStart);

                options: {

        document.getElementById('exportPdfBtn')?.addEventListener('click', () => this.exportPDF());

    async exportPDF() {
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            const settings = JSON.parse(localStorage.getItem('hms_settings')) || {};
            const hotelName = settings.hotelName || 'Grand Hotel';
            const state = AppState.get();
            
            doc.setFontSize(28);
            doc.setTextColor(0, 0, 0);
            doc.text(hotelName, 20, 30);
            doc.setFontSize(20);
            doc.text(Lang.t('report_title'), 20, 50);
            doc.setFontSize(10);
            doc.setTextColor(80, 80, 80);
            doc.text(`${Lang.t('report_generated')}: ${new Date().toLocaleString()}`, 20, 62);
            
            doc.setFontSize(14);
            doc.setTextColor(0, 0, 0);
            let y = 80;
            const metrics = [
                [Lang.t('total_rooms_metric'), state.rooms.length],
                [Lang.t('customers_metric'), state.customers.length],
                [Lang.t('bookings_metric'), state.bookings.length],
                [Lang.t('revenue_metric'), formatCurrency(state.payments.reduce((s, p) => s + (p.status === 'Paid' ? p.amount : 0), 0))],
                [Lang.t('paid_payments_metric'), state.payments.filter(p => p.status === 'Paid').length],
                [Lang.t('occupancy_metric'), `${state.rooms.length > 0 ? Math.round((state.rooms.filter(r => r.status === 'Booked' || r.status === 'Occupied').length / state.rooms.length) * 100) : 0}%`]
            ];
            
            doc.setFontSize(12);
            metrics.forEach(([label, value], i) => {
                const x = 20 + (i % 3) * 80;
                const row = Math.floor(i / 3);
                const yPos = y + row * 20;
                doc.setTextColor(50, 50, 50);
                doc.text(label + ':', x, yPos);
                doc.setTextColor(0, 0, 0);
                doc.text(String(value), x + 60, yPos);
            });
            
            y += 80;
            
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(14);
            doc.text(Lang.t('room_list'), 20, y);
            y += 10;
            doc.setFontSize(10);
            doc.setTextColor(50, 50, 50);
            
            const roomHeaders = ['#', Lang.t('type'), Lang.t('price'), Lang.t('status')];
            const roomCols = [20, 60, 40, 40];
            let roomX = 20;

    async exportExcel() {
        try {
            const state = AppState.get();
            
            const rows = [
                [Lang.t('report_title')],
                [`${Lang.t('report_generated')}: ${new Date().toLocaleString()}`],
                [],
                [Lang.t('report_metrics'), Lang.t('report_value')],
                [Lang.t('total_rooms_metric'), state.rooms.length],
                [Lang.t('customers_metric'), state.customers.length],
                [Lang.t('bookings_metric'), state.bookings.length],
                [Lang.t('revenue_metric'), formatCurrency(state.payments.reduce((s, p) => s + (p.status === 'Paid' ? p.amount : 0), 0))],
                [Lang.t('paid_payments_metric'), state.payments.filter(p => p.status === 'Paid').length],
                [Lang.t('occupancy_metric'), `${state.rooms.length > 0 ? Math.round((state.rooms.filter(r => r.status === 'Booked' || r.status === 'Occupied').length / state.rooms.length) * 100) : 0}%`],
                [],
                [Lang.t('room_list')],
                ['#', Lang.t('type'), Lang.t('price'), Lang.t('status')]
            ];
            
            state.rooms.forEach(r => {
                rows.push([r.number, r.type, r.price, r.status]);
            });
            
            rows.push([]);
            rows.push([Lang.t('booking_list')]);
            rows.push([Lang.t('customer'), Lang.t('room'), Lang.t('checkin'), Lang.t('checkout'), Lang.t('status')]);
            
            state.bookings.forEach(b => {
                const c = state.customers.find(c => c.id === b.customerId);
                const r = state.rooms.find(r => r.id === b.roomId);
                rows.push([c?.name || 'N/A', r?.number || 'N/A', b.checkin, b.checkout, b.status]);
            });
            
            rows.push([]);
            rows.push([Lang.t('payment_list')]);
            rows.push([Lang.t('amount'), Lang.t('method'), Lang.t('status'), Lang.t('date')]);
            
            state.payments.forEach(p => {

            const wb = XLSX.utils.book_new();

    renderProfile() {

                    </div>

                        <label class="form-label">${Lang.t('new_password')}</label>

                    </div>

                </form>
            </div>
        `;

        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const container = document.getElementById('avatarContainer');
                    container.innerHTML = `<img src="${ev.target.result}" alt="Avatar"><input type="file" id="avatarInput" accept="image/*">`;
                    document.getElementById('avatarInput').addEventListener('change', arguments.callee);
                    const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
                    profile.avatar = ev.target.result;
                    localStorage.setItem('hms_profile', JSON.stringify(profile));
                    document.getElementById('removeAvatarBtn').style.display = 'inline-block';
                    Toast.success('Rasm yangilandi');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('removeAvatarBtn').addEventListener('click', function() {
            const container = document.getElementById('avatarContainer');
            container.innerHTML = `<i class="fas fa-user"></i><input type="file" id="avatarInput" accept="image/*">`;
            document.getElementById('avatarInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const container = document.getElementById('avatarContainer');
                        container.innerHTML = `<img src="${ev.target.result}" alt="Avatar"><input type="file" id="avatarInput" accept="image/*">`;
                        document.getElementById('avatarInput').addEventListener('change', arguments.callee);
                        const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
                        profile.avatar = ev.target.result;
                        localStorage.setItem('hms_profile', JSON.stringify(profile));
                        document.getElementById('removeAvatarBtn').style.display = 'inline-block';
                        Toast.success('Rasm yangilandi');
                    };
                    reader.readAsDataURL(file);
                }
            });
            const profile = JSON.parse(localStorage.getItem('hms_profile')) || {};
            delete profile.avatar;
            localStorage.setItem('hms_profile', JSON.stringify(profile));
            this.style.display = 'none';
            Toast.success('Rasm olib tashlandi');
        });

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('profileName').value.trim();
            const email = document.getElementById('profileEmail').value.trim();
            const password = document.getElementById('profilePassword').value;

            document.getElementById('profilePassword').value = '';
